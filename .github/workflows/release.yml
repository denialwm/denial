name: Publish signed Denial public beta
run-name: Promote ${{ github.ref_name }} from validated main candidate

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: denial-public-release-x86_64
  cancel-in-progress: false

jobs:
  resolve:
    name: Verify tag and resolve exact main candidate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      candidate_artifact: ${{ steps.resolve.outputs.candidate_artifact }}
      candidate_run_id: ${{ steps.resolve.outputs.candidate_run_id }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}

    steps:
      - name: Verify signed tag and main candidate provenance
        id: resolve
        shell: bash
        env:
          DENIAL_CHECKOUT_TOKEN: ${{ github.token }}
          EXPECTED_FINGERPRINT: ${{ vars.DENIAL_RELEASE_SIGNING_FINGERPRINT }}
          EXPECTED_GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" == "refs/tags/$RELEASE_TAG" ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_FINGERPRINT" =~ ^[0-9A-F]{40,64}$ ]]
          if gh release view \
            "$RELEASE_TAG" \
            --repo "$REPOSITORY_NAME" \
            >/dev/null 2>&1; then
            printf 'Release already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          askpass="$RUNNER_TEMP/denial-git-askpass"
          tag_gnupg="$RUNNER_TEMP/denial-release-tag-gnupg"
          cleanup() {
            gpgconf --homedir "$tag_gnupg" --kill all >/dev/null 2>&1 || true
            rm -f -- "$askpass"
            if [[ "$tag_gnupg" == \
              "$RUNNER_TEMP/denial-release-tag-gnupg" ]]; then
              rm -rf --one-file-system -- "$tag_gnupg"
            fi
          }
          trap cleanup EXIT

          umask 077
          # The parameter expansions below are literal askpass-script source.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'case "${1:-}" in' \
            '  *Username*) printf "%s\n" x-access-token ;;' \
            '  *Password*) printf "%s\n" "${DENIAL_CHECKOUT_TOKEN:?}" ;;' \
            '  *) exit 1 ;;' \
            'esac' \
            >"$askpass"
          chmod 0700 "$askpass"

          git init --initial-branch=detached .
          git remote add origin "https://github.com/${REPOSITORY_NAME}.git"
          GIT_ASKPASS="$askpass" \
          GIT_ASKPASS_REQUIRE=force \
          GIT_TERMINAL_PROMPT=0 \
          git -c protocol.version=2 fetch \
            --no-tags \
            origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          tag_object="$(git rev-parse "$RELEASE_TAG")"
          source_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$EXPECTED_GITHUB_SHA" != "$source_sha" \
            && "$EXPECTED_GITHUB_SHA" != "$tag_object" ]]; then
            printf \
              'GitHub SHA %s is neither tag object %s nor source commit %s\n' \
              "$EXPECTED_GITHUB_SHA" "$tag_object" "$source_sha" >&2
            exit 1
          fi
          git merge-base --is-ancestor \
            "$source_sha" refs/remotes/origin/main
          git checkout --detach "$source_sha"

          install -d -m 0700 "$tag_gnupg"
          actual_fingerprint="$(
            GNUPGHOME="$tag_gnupg" \
              gpg \
                --batch \
                --show-keys \
                --with-colons \
                --fingerprint \
                packaging/arch/denial-repo-key.asc \
              | awk -F: '$1 == "fpr" { print toupper($10); exit }'
          )"
          [[ "$actual_fingerprint" == "$EXPECTED_FINGERPRINT" ]]
          GNUPGHOME="$tag_gnupg" \
            gpg --batch --import packaging/arch/denial-repo-key.asc
          GNUPGHOME="$tag_gnupg" \
            git -c gpg.program=gpg verify-tag "$RELEASE_TAG"

          workflow_runs="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPOSITORY_NAME}/actions/workflows/branch-validation.yml/runs?branch=main&event=push&status=completed&per_page=100"
          )"
          candidate_run_id="$(
            jq -er \
              --arg source "$source_sha" \
              "[
                .workflow_runs[]
                | select(
                    .head_sha == \$source
                    and .head_branch == \"main\"
                    and .event == \"push\"
                    and .conclusion == \"success\"
                  )
              ]
              | first
              | .id" \
              <<<"$workflow_runs"
          )"
          candidate_artifact="denial-main-validated-candidate-${candidate_run_id}"
          artifact_record="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPOSITORY_NAME}/actions/runs/${candidate_run_id}/artifacts?per_page=100" \
              | jq -er \
                --arg name "$candidate_artifact" \
                "[
                  .artifacts[]
                  | select(.name == \$name and .expired == false)
                ]
                | if length == 1 then first else error(
                    \"expected one unexpired main candidate artifact\"
                  ) end"
          )"
          jq -e '.size_in_bytes > 0' <<<"$artifact_record" >/dev/null

          release_version="${RELEASE_TAG#v}"
          {
            printf 'candidate_artifact=%s\n' "$candidate_artifact"
            printf 'candidate_run_id=%s\n' "$candidate_run_id"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'release_version=%s\n' "$release_version"
            printf 'source_sha=%s\n' "$source_sha"
          } >>"$GITHUB_OUTPUT"
          {
            printf '### Signed-tag promotion authorized\n\n'
            printf -- "- Tag: \`%s\`\n" "$RELEASE_TAG"
            printf -- \
              "- Source/main candidate commit: \`%s\`\n" \
              "$source_sha"
            printf -- '- Main candidate workflow: [%s](https://github.com/%s/actions/runs/%s)\n' \
              "$candidate_run_id" "$REPOSITORY_NAME" "$candidate_run_id"
            printf -- \
              "- Candidate artifact: \`%s\`\n" \
              "$candidate_artifact"
            printf -- '- Compilation requested by this workflow: **no**\n'
          } >>"$GITHUB_STEP_SUMMARY"

  promote-apk:
    name: Promote exact Alpine payload without compilation
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Install isolated Alpine packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libarchive-tools jq
          # Ubuntu 24.04 AppArmor blocks rootless user namespaces by default.
          # This VM is privileged and ephemeral, so enable them for this job.
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap \
            --die-with-parent \
            --unshare-user \
            --ro-bind / / \
            -- /bin/true

      - name: Check out the exact signed source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify promotion checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download independently verified main candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.resolve.outputs.candidate_artifact }}
          path: ${{ runner.temp }}/denial-main-candidate-transfer
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.candidate_run_id }}

      - name: Extract exact main candidate
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 "$RUNNER_TEMP/denial-main-candidate"
          tar \
            --extract \
            --file="$RUNNER_TEMP/denial-main-candidate-transfer/denial-main-candidate.tar" \
            --directory="$RUNNER_TEMP/denial-main-candidate" \
            --no-same-owner

      - name: Repackage the pre-adapted Alpine payload
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          output_root="$RUNNER_TEMP/denial-promoted-apk/packages"
          evidence_root="$RUNNER_TEMP/denial-promoted-apk/evidence"
          install -d -m 0755 "$output_root" "$evidence_root"
          tools/run-denial-promotion-no-build \
            tools/promote-denial-apk-candidate \
            "$RUNNER_TEMP/denial-main-candidate" \
            "$output_root" \
            "$RELEASE_TAG" \
            "$SOURCE_SHA" \
            "$evidence_root/apk-promotion.txt"
          (
            cd "$output_root"
            sha256sum -- *.apk >SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          tar \
            --create \
            --file="$RUNNER_TEMP/denial-promoted-apk.tar" \
            --directory="$RUNNER_TEMP/denial-promoted-apk" \
            .

      - name: Upload promoted Alpine packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denial-release-apk-unsigned-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-promoted-apk.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  promote:
    name: Promote exact main payloads to tag-derived packages
    needs:
      - resolve
      - promote-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux:base-devel

    steps:
      - name: Install promotion verification tools
        shell: bash
        run: pacman -Syu --needed --noconfirm dpkg git jq namcap rpm-tools

      - name: Check out the exact signed source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify promotion checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          test "$(
            git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          )" = "$EXPECTED_SHA"

      - name: Download independently verified main candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.resolve.outputs.candidate_artifact }}
          path: ${{ runner.temp }}/denial-main-candidate-transfer
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.candidate_run_id }}

      - name: Download promoted Alpine packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: denial-release-apk-unsigned-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-promoted-apk-transfer

      - name: Define isolated promotion paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'CANDIDATE_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-main-candidate"
            printf 'PROMOTED_PACKAGE_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-promoted-packages"
            printf 'PROMOTED_NATIVE_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-promoted-native-packages"
            printf 'UNSIGNED_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-release-unsigned"
            printf 'UNSIGNED_ARCHIVE=%s\n' \
              "$RUNNER_TEMP/denial-release-unsigned.tar"
            printf 'PROMOTION_WORK_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-promotion-work"
            printf 'PROMOTION_EVIDENCE=%s\n' \
              "$RUNNER_TEMP/denial-promotion-work/evidence.txt"
            printf 'NATIVE_PROMOTION_EVIDENCE=%s\n' \
              "$RUNNER_TEMP/denial-promotion-work/native-evidence.txt"
          } >>"$GITHUB_ENV"

      - name: Extract and verify main candidate handoff
        shell: bash
        env:
          CANDIDATE_ARTIFACT: ${{ needs.resolve.outputs.candidate_artifact }}
          CANDIDATE_RUN_ID: ${{ needs.resolve.outputs.candidate_run_id }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          candidate_archive="$RUNNER_TEMP/denial-main-candidate-transfer/denial-main-candidate.tar"
          test -f "$candidate_archive"
          install -d -m 0755 "$CANDIDATE_ROOT"
          tar \
            --extract \
            --file="$candidate_archive" \
            --directory="$CANDIDATE_ROOT" \
            --no-same-owner

          provenance="$CANDIDATE_ROOT/evidence/provenance.txt"
          for expected in \
            'artifact_class=production-release-candidate' \
            'publication_authorized=false' \
            'release_signing_eligible=true' \
            'signature_status=unsigned' \
            'package_release=0' \
            'package_formats=arch,deb,rpm,apk' \
            'native_payload_schema=1' \
            'alpine_payload_schema=1' \
            'compile_mode=release' \
            "source_commit=$SOURCE_SHA" \
            'source_ref=refs/heads/main' \
            "workflow_run=$CANDIDATE_RUN_ID" \
            'workflow_event=push'; do
            grep -Fxq "$expected" "$provenance"
          done
          (
            cd "$CANDIDATE_ROOT/packages"
            sha256sum --check --strict SHA256SUMS
          )
          (
            cd "$CANDIDATE_ROOT/native-payload"
            sha256sum --check --strict NATIVE-SHA256SUMS
          )
          (
            cd "$CANDIDATE_ROOT/alpine-payload"
            sha256sum --check --strict ALPINE-SHA256SUMS
          )
          install -d -m 0755 "$RUNNER_TEMP/denial-promoted-apk"
          tar \
            --extract \
            --file="$RUNNER_TEMP/denial-promoted-apk-transfer/denial-promoted-apk.tar" \
            --directory="$RUNNER_TEMP/denial-promoted-apk" \
            --no-same-owner
          (
            cd "$RUNNER_TEMP/denial-promoted-apk/packages"
            sha256sum --check --strict SHA256SUMS
          )
          grep -Fxq 'compiled_payloads_changed=false' \
            "$RUNNER_TEMP/denial-promoted-apk/evidence/apk-promotion.txt"
          printf 'Resolved retained artifact: %s\n' "$CANDIDATE_ARTIFACT"

      - name: Repackage exact payloads with signed-tag identity
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          useradd --create-home --user-group denial-promoter
          install -d -m 0755 \
            "$PROMOTED_PACKAGE_ROOT" \
            "$PROMOTION_WORK_ROOT"
          chown -R denial-promoter:denial-promoter \
            "$GITHUB_WORKSPACE" \
            "$CANDIDATE_ROOT" \
            "$PROMOTED_PACKAGE_ROOT" \
            "$PROMOTION_WORK_ROOT"
          runuser -u denial-promoter -- \
            env \
              DENIAL_PACKAGE_PACKAGER='Doctor Logix <doctor.logix@gmail.com>' \
              tools/run-denial-promotion-no-build \
                tools/promote-denial-arch-candidate \
                "$CANDIDATE_ROOT" \
                "$PROMOTED_PACKAGE_ROOT" \
                "$RELEASE_TAG" \
                "$SOURCE_SHA" \
                "$PROMOTION_EVIDENCE"

      - name: Repackage exact payloads as Debian and RPM packages
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          install -d -m 0755 "$PROMOTED_NATIVE_ROOT"
          chown -R denial-promoter:denial-promoter \
            "$PROMOTED_NATIVE_ROOT" \
            "$PROMOTION_WORK_ROOT"
          runuser -u denial-promoter -- \
            env \
              DENIAL_PACKAGE_PACKAGER='Doctor Logix <doctor.logix@gmail.com>' \
              tools/run-denial-promotion-no-build \
                tools/promote-denial-native-candidate \
                "$CANDIDATE_ROOT" \
                "$PROMOTED_NATIVE_ROOT" \
                "$RELEASE_TAG" \
                "$SOURCE_SHA" \
                "$NATIVE_PROMOTION_EVIDENCE"

      - name: Assemble unsigned promoted release
        shell: bash
        env:
          CANDIDATE_ARTIFACT: ${{ needs.resolve.outputs.candidate_artifact }}
          CANDIDATE_RUN_ID: ${{ needs.resolve.outputs.candidate_run_id }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          install -d -m 0755 \
            "$UNSIGNED_ROOT/packages" \
            "$UNSIGNED_ROOT/evidence/main-candidate" \
            "$UNSIGNED_ROOT/evidence/package-metadata"
          cp -a -- \
            "$CANDIDATE_ROOT/evidence/." \
            "$UNSIGNED_ROOT/evidence/main-candidate/"
          install -m 0644 \
            "$PROMOTION_EVIDENCE" \
            "$UNSIGNED_ROOT/evidence/promotion.txt"
          install -m 0644 \
            "$NATIVE_PROMOTION_EVIDENCE" \
            "$UNSIGNED_ROOT/evidence/native-promotion.txt"
          install -m 0644 \
            "$RUNNER_TEMP/denial-promoted-apk/evidence/apk-promotion.txt" \
            "$UNSIGNED_ROOT/evidence/apk-promotion.txt"

          mapfile -d '' packages < <(
            find "$PROMOTED_PACKAGE_ROOT" \
              -maxdepth 1 \
              -type f \
              -name '*.pkg.tar.zst' \
              -print0 \
              | sort -z
          )
          if ((${#packages[@]} != 3)); then
            printf 'Expected three promoted packages, found %d\n' \
              "${#packages[@]}" >&2
            exit 1
          fi
          for expected_package in \
            "denial-${RELEASE_VERSION}-1-x86_64.pkg.tar.zst" \
            "denial-flutter-engine-1:${RELEASE_VERSION}-1-x86_64.pkg.tar.zst" \
            "denial-ui-development-${RELEASE_VERSION}-1-x86_64.pkg.tar.zst"; do
            test -f "$PROMOTED_PACKAGE_ROOT/$expected_package"
          done
          cp --reflink=auto -- "${packages[@]}" "$UNSIGNED_ROOT/packages/"

          mapfile -d '' native_packages < <(
            find "$PROMOTED_NATIVE_ROOT" \
              -maxdepth 1 \
              -type f \
              \( -name '*.deb' -o -name '*.rpm' \) \
              -print0 \
              | sort -z
          )
          if ((${#native_packages[@]} != 4)); then
            printf 'Expected four promoted native packages, found %d\n' \
              "${#native_packages[@]}" >&2
            exit 1
          fi
          for expected_package in \
            "denial_${RELEASE_VERSION}-1_amd64.deb" \
            "denial-flutter-engine_${RELEASE_VERSION}-1_amd64.deb" \
            "denial-${RELEASE_VERSION}-1.x86_64.rpm" \
            "denial-flutter-engine-${RELEASE_VERSION}-1.x86_64.rpm"; do
            test -f "$PROMOTED_NATIVE_ROOT/$expected_package"
          done
          cp --reflink=auto -- \
            "${native_packages[@]}" "$UNSIGNED_ROOT/packages/"

          mapfile -d '' apk_packages < <(
            find "$RUNNER_TEMP/denial-promoted-apk/packages" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print0 \
              | sort -z
          )
          if ((${#apk_packages[@]} != 2)); then
            printf 'Expected two promoted Alpine packages, found %d\n' \
              "${#apk_packages[@]}" >&2
            exit 1
          fi
          for expected_package in \
            "denial-${RELEASE_VERSION}-r1.apk" \
            "denial-flutter-engine-${RELEASE_VERSION}-r1.apk"; do
            test -f \
              "$RUNNER_TEMP/denial-promoted-apk/packages/$expected_package"
          done
          cp --reflink=auto -- \
            "${apk_packages[@]}" "$UNSIGNED_ROOT/packages/"

          for package in "${packages[@]}"; do
            package_name="$(basename -- "$package")"
            bsdtar -xOf "$package" .PKGINFO \
              >"$UNSIGNED_ROOT/evidence/package-metadata/${package_name}.PKGINFO"
            bsdtar -xOf "$package" .BUILDINFO \
              >"$UNSIGNED_ROOT/evidence/package-metadata/${package_name}.BUILDINFO"
          done
          rpm_query_db="$RUNNER_TEMP/denial-release-rpm-query-db"
          install -d -m 0755 "$rpm_query_db"
          for package in "${native_packages[@]}"; do
            package_name="$(basename -- "$package")"
            case "$package" in
              *.deb)
                dpkg-deb --field "$package" \
                  >"$UNSIGNED_ROOT/evidence/package-metadata/${package_name}.control"
                ;;
              *.rpm)
                rpm --dbpath "$rpm_query_db" -qp --qf \
                  $'name=%{NAME}\nversion=%{VERSION}-%{RELEASE}\narchitecture=%{ARCH}\n' \
                  "$package" \
                  >"$UNSIGNED_ROOT/evidence/package-metadata/${package_name}.rpm"
                ;;
            esac
          done
          for package in "${apk_packages[@]}"; do
            package_name="$(basename -- "$package")"
            bsdtar -xOf "$package" .PKGINFO \
              >"$UNSIGNED_ROOT/evidence/package-metadata/${package_name}.PKGINFO"
          done

          {
            printf 'public_beta=true\n'
            printf 'artifact_class=tag-promoted-main-candidate\n'
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'source_commit=%s\n' "$SOURCE_SHA"
            printf 'main_candidate_run=%s\n' "$CANDIDATE_RUN_ID"
            printf 'main_candidate_artifact=%s\n' "$CANDIDATE_ARTIFACT"
            printf 'promotion_workflow_run=%s\n' "$GITHUB_RUN_ID"
            printf 'promotion_workflow_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'compiled_payloads_changed=false\n'
            printf 'package_formats=arch,deb,rpm,apk\n'
            printf 'promotion_runner_os=%s\n' "$RUNNER_OS"
            printf 'promotion_runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'promoted_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >"$UNSIGNED_ROOT/evidence/provenance.txt"

          (
            cd "$UNSIGNED_ROOT/packages"
            sha256sum -- *.pkg.tar.zst *.deb *.rpm *.apk >SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          namcap "$UNSIGNED_ROOT"/packages/*.pkg.tar.zst \
            2>&1 | tee "$UNSIGNED_ROOT/evidence/namcap.txt"
          tar \
            --create \
            --file="$UNSIGNED_ARCHIVE" \
            --directory="$UNSIGNED_ROOT" \
            .

      - name: Upload unsigned promoted release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denial-release-unsigned-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-release-unsigned.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    name: Sign and verify release repository
    needs:
      - resolve
      - promote
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-signing
    container:
      image: archlinux:base-devel

    steps:
      - name: Define isolated signing paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'GNUPGHOME=%s\n' \
              "$RUNNER_TEMP/denial-release-gnupg"
            printf 'SIGNED_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-release-signed"
            printf 'UNSIGNED_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-release-unsigned"
          } >>"$GITHUB_ENV"

      - name: Install checkout, package, and signing tools
        shell: bash
        run: >-
          pacman -Syu --needed --noconfirm
          apt createrepo_c dpkg git gnupg gzip rpm-tools xz

      - name: Check out the exact signed source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify signing checkout and promotion provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          test "$(
            git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          )" = "$EXPECTED_SHA"

      - name: Download unsigned promoted release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: denial-release-unsigned-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-release-unsigned-transfer

      - name: Extract and verify unsigned promoted release
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ needs.resolve.outputs.candidate_run_id }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          install -d -m 0755 "$UNSIGNED_ROOT"
          tar \
            --extract \
            --file="$RUNNER_TEMP/denial-release-unsigned-transfer/denial-release-unsigned.tar" \
            --directory="$UNSIGNED_ROOT" \
            --no-same-owner
          provenance="$UNSIGNED_ROOT/evidence/provenance.txt"
          for expected in \
            'public_beta=true' \
            'artifact_class=tag-promoted-main-candidate' \
            "release_tag=$RELEASE_TAG" \
            "source_commit=$SOURCE_SHA" \
            "main_candidate_run=$CANDIDATE_RUN_ID" \
            "promotion_workflow_run=$GITHUB_RUN_ID" \
            'compiled_payloads_changed=false' \
            'package_formats=arch,deb,rpm,apk'; do
            grep -Fxq "$expected" "$provenance"
          done
          grep -Fxq 'compiled_payloads_changed=false' \
            "$UNSIGNED_ROOT/evidence/promotion.txt"
          grep -Fxq 'compiled_payloads_changed=false' \
            "$UNSIGNED_ROOT/evidence/native-promotion.txt"
          grep -Fxq 'compiled_payloads_changed=false' \
            "$UNSIGNED_ROOT/evidence/apk-promotion.txt"
          (
            cd "$UNSIGNED_ROOT/packages"
            sha256sum --check --strict SHA256SUMS
          )

      - name: Import release-signing subkey
        shell: bash
        env:
          DENIAL_RELEASE_SIGNING_KEY: ${{ secrets.DENIAL_RELEASE_SIGNING_KEY }}
          EXPECTED_FINGERPRINT: ${{ vars.DENIAL_RELEASE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_FINGERPRINT" =~ ^[0-9A-F]{40,64}$ ]]
          test -n "$DENIAL_RELEASE_SIGNING_KEY"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$DENIAL_RELEASE_SIGNING_KEY" \
            | gpg --batch --import
          actual_fingerprint="$(
            gpg \
              --batch \
              --with-colons \
              --fingerprint \
              --list-secret-keys \
              "$EXPECTED_FINGERPRINT" \
              | awk -F: '$1 == "fpr" { print toupper($10); exit }'
          )"
          test "$actual_fingerprint" = "$EXPECTED_FINGERPRINT"

      - name: Sign packages and repository databases
        shell: bash
        env:
          DENIAL_RELEASE_BUILD_RUN: ${{ needs.resolve.outputs.candidate_run_id }}
          DENIAL_RELEASE_SIGNING_PASSPHRASE: ${{ secrets.DENIAL_RELEASE_SIGNING_PASSPHRASE }}
          DENIAL_RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          DENIAL_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          DENIAL_RELEASE_TOOLING_SHA: ${{ needs.resolve.outputs.source_sha }}
          DENIAL_RELEASE_WORKFLOW_RUN: ${{ github.run_id }}
          EXPECTED_FINGERPRINT: ${{ vars.DENIAL_RELEASE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          tools/denial-repository \
            "$UNSIGNED_ROOT" \
            "$SIGNED_ROOT" \
            "$EXPECTED_FINGERPRINT"
          tar \
            --create \
            --file="$RUNNER_TEMP/denial-release-signed.tar" \
            --directory="$SIGNED_ROOT" \
            .

      - name: Upload signed release repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denial-release-signed-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-release-signed.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Erase imported release key
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gpgconf --kill all >/dev/null 2>&1 || true
          if [[ "$GNUPGHOME" == "$RUNNER_TEMP/denial-release-gnupg" ]]; then
            rm -rf --one-file-system -- "$GNUPGHOME"
          fi

  verify-rpm-publication:
    name: Independently verify RPM and DNF publication input
    needs:
      - resolve
      - sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: registry.fedoraproject.org/fedora@sha256:94621cbf28eea7bfbe330203ae98ffc9dd46a92b29b3d44cb61dd29203f1fc22

    steps:
      - name: Install Fedora repository client tools
        shell: bash
        run: >-
          dnf install
          --setopt=install_weak_deps=False
          --assumeyes
          coreutils diffutils findutils gawk git gnupg2 grep rpm tar

      - name: Define RPM verification paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'SIGNED_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-release-signed"
          } >>"$GITHUB_ENV"

      - name: Check out the exact signed source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download signed repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: denial-release-signed-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-release-signed-transfer

      - name: Extract signed repository
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 "$SIGNED_ROOT"
          tar \
            --extract \
            --file="$RUNNER_TEMP/denial-release-signed-transfer/denial-release-signed.tar" \
            --directory="$SIGNED_ROOT" \
            --no-same-owner

      - name: Verify embedded RPM signatures and DNF behavior
        shell: bash
        env:
          EXPECTED_FINGERPRINT: ${{ vars.DENIAL_RELEASE_SIGNING_FINGERPRINT }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        run: |
          set -euo pipefail
          test "$(
            git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          )" = "${{ needs.resolve.outputs.source_sha }}"
          tools/verify-denial-published-rpm-repository \
            "$SIGNED_ROOT" \
            "$EXPECTED_FINGERPRINT" \
            "$RELEASE_VERSION" \
            1

  verify-apk-publication:
    name: Independently verify Alpine APK publication input
    needs:
      - resolve
      - sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: archlinux:base-devel

    steps:
      - name: Install Alpine and OpenPGP verification tools
        shell: bash
        run: pacman -Syu --needed --noconfirm apk-tools git gnupg

      - name: Check out the exact signed source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download signed repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: denial-release-signed-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-release-signed-transfer

      - name: Extract signed repository
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 "$RUNNER_TEMP/denial-release-signed"
          tar \
            --extract \
            --file="$RUNNER_TEMP/denial-release-signed-transfer/denial-release-signed.tar" \
            --directory="$RUNNER_TEMP/denial-release-signed" \
            --no-same-owner

      - name: Verify APK metadata, signatures, and dependency resolution
        shell: bash
        env:
          EXPECTED_FINGERPRINT: ${{ vars.DENIAL_RELEASE_SIGNING_FINGERPRINT }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        run: |
          set -euo pipefail
          test "$(
            git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          )" = "${{ needs.resolve.outputs.source_sha }}"
          tools/verify-denial-published-apk-packages \
            "$RUNNER_TEMP/denial-release-signed" \
            "$EXPECTED_FINGERPRINT" \
            "$RELEASE_VERSION" \
            1

  publish:
    name: Publish GitHub Release and package repositories
    needs:
      - resolve
      - sign
      - verify-apk-publication
      - verify-rpm-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Define publication paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'GNUPGHOME=%s\n' \
              "$RUNNER_TEMP/denial-release-verification-gnupg"
            printf 'SIGNED_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-release-signed"
          } >>"$GITHUB_ENV"

      - name: Install independent APT verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gnupg

      - name: Check out the exact signed source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download signed repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: denial-release-signed-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-release-signed-transfer

      - name: Extract signed repository
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 "$SIGNED_ROOT"
          tar \
            --extract \
            --file="$RUNNER_TEMP/denial-release-signed-transfer/denial-release-signed.tar" \
            --directory="$SIGNED_ROOT" \
            --no-same-owner

      - name: Independently verify publication input
        shell: bash
        env:
          EXPECTED_FINGERPRINT: ${{ vars.DENIAL_RELEASE_SIGNING_FINGERPRINT }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.source_sha }}"
          tools/verify-denial-published-repositories-common \
            "$SIGNED_ROOT" \
            "$EXPECTED_FINGERPRINT" \
            "$RELEASE_VERSION" \
            1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload complete Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/denial-release-signed

      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view \
            "$RELEASE_TAG" \
            --repo "$REPOSITORY_NAME" \
            >/dev/null 2>&1; then
            printf 'Release already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          evidence_archive="$RUNNER_TEMP/denial-${RELEASE_VERSION}-release-evidence.tar.gz"
          tar -czf "$evidence_archive" -C "$SIGNED_ROOT" .
          mapfile -d '' repository_assets < <(
            find \
              "$SIGNED_ROOT/x86_64" \
              "$SIGNED_ROOT/downloads/x86_64" \
              -maxdepth 1 \
              -type f \
              -print0 \
              | sort -z
          )
          gh release create \
            "$RELEASE_TAG" \
            --repo "$REPOSITORY_NAME" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "$RELEASE_TAG" \
            --notes-file "$SIGNED_ROOT/RELEASE-NOTES.md" \
            "${repository_assets[@]}" \
            "$SIGNED_ROOT/denial-repo-key.asc" \
            "$SIGNED_ROOT/RELEASE-METADATA.txt" \
            "$SIGNED_ROOT/SHA256SUMS" \
            "$SIGNED_ROOT/SHA256SUMS.sig" \
            "$evidence_archive"

      - name: Deploy complete repository snapshot to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit \
            "$RELEASE_TAG" \
            --repo "$REPOSITORY_NAME" \
            --draft=false \
            --prerelease

      - name: Erase verification keyring
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gpgconf --kill all >/dev/null 2>&1 || true
          if [[ "$GNUPGHOME" == \
            "$RUNNER_TEMP/denial-release-verification-gnupg" ]]; then
            rm -rf --one-file-system -- "$GNUPGHOME"
          fi
