name: Validate Denial branches
run-name: Validate ${{ github.ref_name }} at ${{ github.sha }}

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: denial-branch-validation-x86_64-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  nix-evaluation:
    name: Evaluate Nix package and module contracts
    needs: authorize
    if: >-
      github.ref == 'refs/heads/dev'
      || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the exact pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: accept-flake-config = true
          github_access_token: ${{ github.token }}

      - name: Evaluate all flake outputs
        shell: bash
        run: nix flake check --no-build --print-build-logs

      - name: Verify source locks and module integration
        shell: bash
        run: >-
          nix build
          .#checks.x86_64-linux.locks
          .#checks.x86_64-linux.module
          .#checks.x86_64-linux.module-unstable
          .#checks.x86_64-linux.engine-manifest
          --no-link --print-build-logs

  build:
    name: Build and test ${{ github.ref_name }} candidates
    needs: authorize
    if: >-
      github.ref == 'refs/heads/dev'
      || github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
      - x64
      - denial-builder
    timeout-minutes: 240

    steps:
      - name: Require a fresh runner workspace
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          entries=(*)
          if ((${#entries[@]} != 0)); then
            printf 'Refusing reused workspace: %s\n' "$GITHUB_WORKSPACE" >&2
            exit 1
          fi

      - name: Define branch validation policy
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/dev)
              candidate_class='development-test-candidate'
              release_signing_eligible='false'
              validation_branch='dev'
              compile_mode='release'
              ;;
            refs/heads/main)
              candidate_class='production-release-candidate'
              release_signing_eligible='true'
              validation_branch='main'
              compile_mode='release'
              ;;
            *)
              printf 'Unsupported validation ref: %s\n' "$GITHUB_REF" >&2
              exit 1
              ;;
          esac
          {
            printf 'CANDIDATE_CLASS=%s\n' "$candidate_class"
            printf 'DENIAL_PACKAGE_RELEASE=%s\n' '0'
            printf 'RELEASE_SIGNING_ELIGIBLE=%s\n' \
              "$release_signing_eligible"
            printf 'VALIDATION_BRANCH=%s\n' "$validation_branch"
            printf 'CANDIDATE_COMPILE_MODE=%s\n' "$compile_mode"
            printf 'DENIAL_BUILD_IDENTITY=%s.g%s\n' \
              "$validation_branch" "$GITHUB_SHA"
          } >>"$GITHUB_ENV"

      - name: Define isolated build paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'CARGO_HOME=%s\n' \
              '/srv/denial-builder/cache/cargo'
            printf 'PUB_CACHE=%s\n' \
              '/srv/denial-builder/cache/pub'
            printf 'DENIAL_PC_DEPENDENCY_ROOT=%s\n' \
              '/srv/denial-builder/cache/dependencies'
            printf 'DENIAL_PC_RUST_TARGET=%s\n' \
              '/srv/denial-builder/cache/rust-target'
            printf 'DENIAL_FLUTTER_ENGINE_CACHE_ROOT=%s\n' \
              '/srv/denial-builder/cache/flutter-engine'
            printf 'DENIAL_ALPINE_CACHE_ROOT=%s\n' \
              '/srv/denial-builder/cache/alpine'
            printf 'DENIAL_FLUTTER_ENGINE_JOBS=%s\n' '16'
            printf 'EVIDENCE_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-evidence"
            printf 'CANDIDATE_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-candidate"
            printf 'CANDIDATE_ARCHIVE=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-candidate.tar"
            printf 'DENIAL_PC_PACKAGE_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-packages"
            printf 'DENIAL_PC_MAKEPKG_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-makepkg"
            printf 'DENIAL_PC_PACKAGE_INPUT_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-package-input"
            printf 'DENIAL_PC_ALPINE_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-alpine"
            printf 'DENIAL_ALPINE_EVIDENCE_FILE=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-evidence/alpine-build-environment.txt"
          } >>"$GITHUB_ENV"

      - name: Check out the exact pushed commit
        shell: bash
        env:
          DENIAL_CHECKOUT_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          askpass="$RUNNER_TEMP/denial-git-askpass"
          trap 'rm -f -- "$askpass"' EXIT
          umask 077
          # The parameter expansions below are literal askpass-script source.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'case "${1:-}" in' \
            '  *Username*) printf "%s\n" x-access-token ;;' \
            '  *Password*) printf "%s\n" "${DENIAL_CHECKOUT_TOKEN:?}" ;;' \
            '  *) exit 1 ;;' \
            'esac' \
            >"$askpass"
          chmod 0700 "$askpass"

          git init --initial-branch="$VALIDATION_BRANCH" .
          git remote add origin "https://github.com/${REPOSITORY_NAME}.git"
          GIT_ASKPASS="$askpass" \
          GIT_ASKPASS_REQUIRE=force \
          GIT_TERMINAL_PROMPT=0 \
          git -c protocol.version=2 fetch \
            --no-tags \
            origin \
            "$EXPECTED_SHA" \
            '+refs/tags/v*:refs/tags/v*'
          git checkout -B "$VALIDATION_BRANCH" FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git branch --show-current)" = "$VALIDATION_BRANCH"

      - name: Audit source and builder
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 "$EVIDENCE_ROOT"
          actionlint 2>&1 | tee "$EVIDENCE_ROOT/actionlint.txt"
          tools/denial-release source-audit --branch "$VALIDATION_BRANCH" \
            2>&1 | tee "$EVIDENCE_ROOT/source-audit.txt"
          tools/denial-release doctor --ci --branch "$VALIDATION_BRANCH" \
            2>&1 | tee "$EVIDENCE_ROOT/builder-doctor.txt"

      - name: Require Cachix write credential
        shell: bash
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            printf '%s\n' \
              'CACHIX_AUTH_TOKEN must be a repository Actions secret.' >&2
            exit 1
          fi

      - name: Build cacheable Nix package and checks
        id: nix_cache_build
        shell: bash
        run: |
          set -euo pipefail
          cache_name="$(jq -er '.name' nix/cachix-cache.json)"
          # The newest build of each branch stays a GC root, so cleaning
          # the store keeps what the next run would otherwise rebuild.
          nix_roots="/srv/denial-builder/cache/nix-roots/$VALIDATION_BRANCH"
          mkdir -p "$nix_roots"
          mapfile -t nix_paths < <(
            nix build \
              .#denial \
              .#denial-flutter \
              .#denial-flutter-engine-raw \
              .#denial-unstable \
              .#checks.x86_64-linux.locks \
              .#checks.x86_64-linux.module \
              .#checks.x86_64-linux.module-unstable \
              .#checks.x86_64-linux.engine-manifest \
              .#checks.x86_64-linux.engine-cache \
              .#checks.x86_64-linux.engine-cache-unstable \
              .#checks.x86_64-linux.path-contract \
              --accept-flake-config \
              --max-jobs 3 \
              --cores 16 \
              --out-link "$nix_roots/result" \
              --print-out-paths \
              2> >(tee "$EVIDENCE_ROOT/nix-build.txt" >&2)
          )
          ((${#nix_paths[@]} == 11))
          for path in "${nix_paths[@]}"; do
            [[ "$path" == /nix/store/* ]]
          done
          printf '%s\n' "${nix_paths[@]}" \
            | sort --unique \
            | tee "$EVIDENCE_ROOT/nix-cache-paths.txt"
          cache_paths="$(paste -sd ' ' "$EVIDENCE_ROOT/nix-cache-paths.txt")"
          [[ "$cache_paths" != *$'\n'* ]]
          {
            printf 'cache_name=%s\n' "$cache_name"
            printf 'paths=%s\n' "$cache_paths"
          } >>"$GITHUB_OUTPUT"

      - name: Resolve pinned Cachix CLI
        id: cachix_cli
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t cachix_paths < <(
            nix build \
              .#denial-cachix-cli \
              --accept-flake-config \
              --no-link \
              --print-out-paths
          )
          ((${#cachix_paths[@]} == 1))
          cachix_bin="${cachix_paths[0]}/bin/cachix"
          [[ "$cachix_bin" == /nix/store/*/bin/cachix ]]
          test -x "$cachix_bin"
          printf 'bin=%s\n' "$cachix_bin" >>"$GITHUB_OUTPUT"

      # The action pushes in its post step, at the end of the job, also when
      # a later step fails. Set up here, it keeps what the Nix build made,
      # the engine above all, out of the next run's work.
      - name: Publish Nix closures to Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.nix_cache_build.outputs.cache_name }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachixBin: ${{ steps.cachix_cli.outputs.bin }}
          pathsToPush: ${{ steps.nix_cache_build.outputs.paths }}
          skipAddingSubstituter: true

      - name: Bootstrap pinned development toolchains
        shell: bash
        run: |
          set -euo pipefail
          tools/denial-pc bootstrap \
            2>&1 | tee "$EVIDENCE_ROOT/bootstrap.txt"

      - name: Build or reuse the locked Flutter engine
        shell: bash
        run: |
          set -euo pipefail
          tools/denial-flutter-engine build \
            --github-env "$GITHUB_ENV" \
            2>&1 | tee "$EVIDENCE_ROOT/flutter-engine.txt"

      - name: Build Flutter integration-test bundle
        shell: bash
        run: |
          set -euo pipefail
          tools/denial-pc bundle \
            2>&1 | tee "$EVIDENCE_ROOT/integration-test-bundle.txt"

      - name: Validate plugin SDK without a development engine
        shell: bash
        run: |
          set -euo pipefail
          tools/denial-pc sdk-test \
            2>&1 | tee "$EVIDENCE_ROOT/sdk-tests.txt"
          tools/denial-pc plugin-check \
            2>&1 | tee "$EVIDENCE_ROOT/plugin-checks.txt"

      - name: Run release-path compositor tests
        shell: bash
        env:
          # The hardened runner denies the test's SCHED_RESET_ON_FORK syscall.
          DENIAL_SKIP_CPU_CAPACITY_TEST: "1"
        run: |
          set -euo pipefail
          tools/denial-pc compositor-test \
            2>&1 | tee "$EVIDENCE_ROOT/denial-tests.txt"
          (
            cd "$DENIAL_PC_DEPENDENCY_ROOT/flutter/packages/flutter_tools"
            ../../bin/flutter test \
              test/general.shard/dap/flutter_adapter_test.dart
          ) 2>&1 | tee "$EVIDENCE_ROOT/flutter-tool-tests.txt"

      - name: Build candidate packages
        shell: bash
        env:
          DENIAL_PACKAGE_PACKAGER: Doctor Logix <doctor.logix@gmail.com>
          DENIAL_PACKAGE_SKIP_STAGE: "1"
          DENIAL_REBUILD_ENGINE_PACKAGE: "1"
        run: |
          set -euo pipefail
          TIMEFORMAT=$'real_seconds=%3R\nuser_seconds=%3U\nsystem_seconds=%3S\ncpu_percent=%P'
          {
            time tools/stage-denial-runtime
            time tools/denial-pc arch-package
            time tools/denial-pc native-packages
            time tools/denial-pc alpine-package
          } 2>&1 | tee "$EVIDENCE_ROOT/package-build.txt"

      - name: Assemble candidate and build evidence
        shell: bash
        run: tools/assemble-denial-candidate x86_64

      - name: Upload branch validation candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denial-${{ github.ref_name }}-validated-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-${{ github.ref_name }}-candidate.tar
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}
          compression-level: 0

      # The aarch64 packages are cross-built here from the same checkout, with
      # the same tools, against the Arch Linux ARM root the builder holds.
      # Nothing is tested on aarch64: this host cannot run it.
      - name: Switch to the aarch64 cross build
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'DENIAL_TARGET_ARCH=%s\n' 'aarch64'
            printf 'DENIAL_ARM64_SYSROOT=%s\n' \
              '/srv/denial-builder/sysroot/aarch64'
            printf 'EVIDENCE_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-aarch64-evidence"
            printf 'CANDIDATE_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-aarch64-candidate"
            printf 'CANDIDATE_ARCHIVE=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-aarch64-candidate.tar"
            printf 'DENIAL_PC_PACKAGE_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-aarch64-packages"
            printf 'DENIAL_PC_MAKEPKG_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-aarch64-makepkg"
            printf 'DENIAL_PC_PACKAGE_INPUT_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-aarch64-package-input"
          } >>"$GITHUB_ENV"
          install -d -m 0755 \
            "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-aarch64-evidence"

      - name: Add the aarch64 Rust target
        shell: bash
        run: |
          set -euo pipefail
          tools/denial-pc bootstrap \
            2>&1 | tee "$EVIDENCE_ROOT/bootstrap.txt"

      - name: Build or reuse the locked aarch64 Flutter engine
        shell: bash
        run: |
          set -euo pipefail
          tools/denial-flutter-engine build \
            --github-env "$GITHUB_ENV" \
            2>&1 | tee "$EVIDENCE_ROOT/flutter-engine.txt"

      - name: Build aarch64 Flutter bundle
        shell: bash
        run: |
          set -euo pipefail
          tools/denial-pc bundle \
            2>&1 | tee "$EVIDENCE_ROOT/bundle.txt"

      - name: Build aarch64 candidate packages
        shell: bash
        env:
          DENIAL_PACKAGE_PACKAGER: Doctor Logix <doctor.logix@gmail.com>
          DENIAL_PACKAGE_SKIP_STAGE: "1"
          DENIAL_REBUILD_ENGINE_PACKAGE: "1"
        run: |
          set -euo pipefail
          TIMEFORMAT=$'real_seconds=%3R\nuser_seconds=%3U\nsystem_seconds=%3S\ncpu_percent=%P'
          {
            time tools/stage-denial-runtime
            time tools/denial-pc arch-package
            time tools/denial-pc native-packages
          } 2>&1 | tee "$EVIDENCE_ROOT/package-build.txt"

      - name: Assemble aarch64 candidate and build evidence
        shell: bash
        run: tools/assemble-denial-candidate aarch64

      - name: Upload aarch64 branch validation candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denial-${{ github.ref_name }}-validated-candidate-aarch64-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-${{ github.ref_name }}-aarch64-candidate.tar
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}
          compression-level: 0


      - name: Collect failed build diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          failure_root="$RUNNER_TEMP/denial-$GITHUB_REF_NAME-failure"
          install -d -m 0755 "$failure_root"
          x86_64_evidence="$RUNNER_TEMP/denial-${VALIDATION_BRANCH:-}-evidence"
          aarch64_evidence="$RUNNER_TEMP/denial-${VALIDATION_BRANCH:-}-aarch64-evidence"
          if [[ -d "$x86_64_evidence" ]]; then
            cp -a -- "$x86_64_evidence" "$failure_root/evidence"
          fi
          if [[ -d "$aarch64_evidence" ]]; then
            cp -a -- "$aarch64_evidence" "$failure_root/aarch64-evidence"
          fi
          # The job log keeps only the tail of a failed Nix build; keep the
          # full builder logs here.
          if [[ -f "$x86_64_evidence/nix-build.txt" ]]; then
            install -d -m 0755 "$failure_root/nix-logs"
            { grep -E "builder for|Cannot build" "$x86_64_evidence/nix-build.txt" || true; } \
              | grep -oE "/nix/store/[a-z0-9]{32}-[^' ]+\.drv" \
              | sort --unique \
              | while read -r drv; do
                  nix log "$drv" >"$failure_root/nix-logs/${drv##*/}.log" 2>&1 || true
                done
          fi

      - name: Upload failed build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denial-${{ github.ref_name }}-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/denial-${{ github.ref_name }}-failure
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

  verify:
    name: Independently verify candidate artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: archlinux:base-devel

    steps:
      - name: Install verification tools
        shell: bash
        run: >-
          pacman -Syu --needed --noconfirm
          apt createrepo_c dnf dpkg git gnupg jq rpm-tools

      - name: Check out the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source checkout
        shell: bash
        run: |
          test "$(
            git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          )" = "$GITHUB_SHA"

      - name: Download candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: denial-${{ github.ref_name }}-validated-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-${{ github.ref_name }}-candidate-transfer

      - name: Extract candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/denial-${GITHUB_REF_NAME}-candidate"
          candidate_archive="$RUNNER_TEMP/denial-${GITHUB_REF_NAME}-candidate-transfer/denial-${GITHUB_REF_NAME}-candidate.tar"
          install -d -m 0755 "$candidate_root"
          tar \
            --extract \
            --file="$candidate_archive" \
            --directory="$candidate_root" \
            --no-same-owner

      - name: Download aarch64 candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: denial-${{ github.ref_name }}-validated-candidate-aarch64-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-${{ github.ref_name }}-aarch64-candidate-transfer

      - name: Extract aarch64 candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/denial-${GITHUB_REF_NAME}-aarch64-candidate"
          candidate_archive="$RUNNER_TEMP/denial-${GITHUB_REF_NAME}-aarch64-candidate-transfer/denial-${GITHUB_REF_NAME}-aarch64-candidate.tar"
          install -d -m 0755 "$candidate_root"
          tar \
            --extract \
            --file="$candidate_archive" \
            --directory="$candidate_root" \
            --no-same-owner

      - name: Verify provenance and package contents
        shell: bash
        run: >-
          tools/verify-denial-candidate x86_64
          "$RUNNER_TEMP/denial-${GITHUB_REF_NAME}-candidate"

      - name: Verify aarch64 provenance and package contents
        shell: bash
        run: >-
          tools/verify-denial-candidate aarch64
          "$RUNNER_TEMP/denial-${GITHUB_REF_NAME}-aarch64-candidate"

      - name: Rehearse signed APT and DNF repository generation
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/denial-${{ github.ref_name }}-candidate
          AARCH64_CANDIDATE_ROOT: ${{ runner.temp }}/denial-${{ github.ref_name }}-aarch64-candidate
        run: |
          set -euo pipefail
          mapfile -t native_metadata < <(
            tools/read-denial-native-metadata \
              "$CANDIDATE_ROOT/native-payload/metadata.json"
          )
          test "${#native_metadata[@]}" -eq 7
          test "${native_metadata[1]}" = 0
          tools/test-denial-repository-generators \
            "${native_metadata[0]}" \
            "${native_metadata[1]}" \
            "$CANDIDATE_ROOT/packages" \
            "$AARCH64_CANDIDATE_ROOT/packages"

      - name: Test guided repository setup state handling
        shell: bash
        run: tools/test-denial-repository-setup

      - name: Record validation result
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            printf '%s\n' \
              'The production-mode main candidate passed independent verification.' \
              'Its exact compiled payloads are eligible for later signed-tag promotion.'
          else
            printf '%s\n' \
              'The installable dev candidate passed independent verification.' \
              'Package release 0 is ineligible for release signing or publication.'
          fi

  rehearse-apk-promotion:
    name: Rehearse Alpine release promotion on hosted Ubuntu
    needs: verify
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the exact main candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install and qualify isolated Alpine packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libarchive-tools jq
          tools/prepare-denial-apk-promotion-host

      - name: Download exact main candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: denial-main-validated-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-main-candidate-transfer

      - name: Extract exact main candidate
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 "$RUNNER_TEMP/denial-main-candidate"
          tar \
            --extract \
            --file="$RUNNER_TEMP/denial-main-candidate-transfer/denial-main-candidate.tar" \
            --directory="$RUNNER_TEMP/denial-main-candidate" \
            --no-same-owner

      - name: Promote with disposable release metadata
        shell: bash
        env:
          REHEARSAL_TAG: v0.0.0
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git tag "$REHEARSAL_TAG" "$GITHUB_SHA"
          output_root="$RUNNER_TEMP/denial-apk-rehearsal/packages"
          evidence_root="$RUNNER_TEMP/denial-apk-rehearsal/evidence"
          install -d -m 0755 "$output_root" "$evidence_root"
          tools/run-denial-promotion-no-build \
            tools/promote-denial-apk-candidate \
            "$RUNNER_TEMP/denial-main-candidate" \
            "$output_root" \
            "$REHEARSAL_TAG" \
            "$GITHUB_SHA" \
            "$evidence_root/apk-promotion.txt"
          (
            cd "$output_root"
            sha256sum -- *.apk >SHA256SUMS
            sha256sum --check --strict --quiet SHA256SUMS
          )
          tar \
            --create \
            --file="$RUNNER_TEMP/denial-apk-rehearsal.tar" \
            --directory="$RUNNER_TEMP/denial-apk-rehearsal" \
            .

      - name: Upload disposable APK promotion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denial-main-apk-rehearsal-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-apk-rehearsal.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  verify-apk-rehearsal:
    name: Rehearse signed APK verification as root
    needs: rehearse-apk-promotion
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: archlinux:base-devel

    steps:
      - name: Install Alpine and OpenPGP verification tools
        shell: bash
        run: pacman -Syu --needed --noconfirm apk-tools git gnupg

      - name: Check out the exact main candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download disposable APK promotion
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: denial-main-apk-rehearsal-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-apk-rehearsal-transfer

      - name: Extract disposable APK promotion
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 "$RUNNER_TEMP/denial-apk-rehearsal"
          tar \
            --extract \
            --file="$RUNNER_TEMP/denial-apk-rehearsal-transfer/denial-apk-rehearsal.tar" \
            --directory="$RUNNER_TEMP/denial-apk-rehearsal" \
            --no-same-owner

      - name: Sign with a disposable key and run the publication verifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = 0
          test "$(
            git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          )" = "$GITHUB_SHA"
          tools/test-denial-apk-publication \
            "$RUNNER_TEMP/denial-apk-rehearsal/packages" \
            0.0.0 \
            1

  authorize:
    name: Authorize branch candidate build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out main with promotion history
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact validated dev promotion
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          PREVIOUS_MAIN_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          mapfile -t commit_and_parents < <(
            git rev-list --parents -n 1 HEAD
          )
          read -r -a revision <<<"${commit_and_parents[0]}"
          if ((${#revision[@]} != 3)); then
            printf \
              'Main promotion must be one merge commit with two parents; found %d parents\n' \
              "$((${#revision[@]} - 1))" >&2
            exit 1
          fi

          previous_main="${revision[1]}"
          validated_dev="${revision[2]}"
          if [[ -n "$PREVIOUS_MAIN_SHA" \
            && "$PREVIOUS_MAIN_SHA" != 0000000000000000000000000000000000000000 ]]; then
            test "$previous_main" = "$PREVIOUS_MAIN_SHA"
          fi
          test "$(git rev-parse 'HEAD^{tree}')" = \
            "$(git rev-parse "${validated_dev}^{tree}")"

          git fetch --no-tags origin \
            '+refs/heads/dev:refs/remotes/origin/dev'
          git merge-base --is-ancestor \
            "$validated_dev" refs/remotes/origin/dev

          workflow_runs="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPOSITORY_NAME}/actions/workflows/branch-validation.yml/runs?branch=dev&event=push&status=completed&per_page=100"
          )"
          validation_run="$(
            jq -er \
              --arg source "$validated_dev" \
              '[
                .workflow_runs[]
                | select(
                    .head_sha == $source
                    and .head_branch == "dev"
                    and .event == "push"
                    and .conclusion == "success"
                  )
              ]
              | first
              | .id' \
              <<<"$workflow_runs"
          )"

          {
            printf '### Exact dev promotion verified\n\n'
            printf -- '- Main merge: %s\n' "$EXPECTED_MAIN_SHA"
            printf -- '- Validated dev commit: %s\n' "$validated_dev"
            printf -- '- Successful dev workflow: [%s](https://github.com/%s/actions/runs/%s)\n' \
              "$validation_run" "$REPOSITORY_NAME" "$validation_run"
            printf -- '- Main and validated dev tree: %s\n' \
              "$(git rev-parse 'HEAD^{tree}')"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Authorize development candidate
        if: github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev
          printf '%s\n' \
            'Development source accepted for independent candidate validation.' \
            >>"$GITHUB_STEP_SUMMARY"
