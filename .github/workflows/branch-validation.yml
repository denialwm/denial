name: Validate Denial branches
run-name: Validate ${{ github.ref_name }} at ${{ github.sha }}

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: denial-branch-validation-x86_64-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  build:
    name: Build and test ${{ github.ref_name }} x86-64 candidate
    needs: authorize
    if: >-
      github.ref == 'refs/heads/dev'
      || github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
      - x64
      - denial-builder
    timeout-minutes: 240

    steps:
      - name: Require a fresh runner workspace
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          entries=(*)
          if ((${#entries[@]} != 0)); then
            printf 'Refusing reused workspace: %s\n' "$GITHUB_WORKSPACE" >&2
            exit 1
          fi

      - name: Define branch validation policy
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/dev)
              candidate_class='development-test-candidate'
              release_signing_eligible='false'
              validation_branch='dev'
              compile_mode='release'
              ;;
            refs/heads/main)
              candidate_class='production-release-candidate'
              release_signing_eligible='true'
              validation_branch='main'
              compile_mode='release'
              ;;
            *)
              printf 'Unsupported validation ref: %s\n' "$GITHUB_REF" >&2
              exit 1
              ;;
          esac
          {
            printf 'CANDIDATE_CLASS=%s\n' "$candidate_class"
            printf 'DENIAL_PACKAGE_RELEASE=%s\n' '0'
            printf 'RELEASE_SIGNING_ELIGIBLE=%s\n' \
              "$release_signing_eligible"
            printf 'VALIDATION_BRANCH=%s\n' "$validation_branch"
            printf 'CANDIDATE_COMPILE_MODE=%s\n' "$compile_mode"
            printf 'DENIAL_BUILD_IDENTITY=%s.g%s\n' \
              "$validation_branch" "$GITHUB_SHA"
          } >>"$GITHUB_ENV"

      - name: Define isolated build paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'CARGO_HOME=%s\n' \
              '/srv/denial-builder/cache/cargo'
            printf 'PUB_CACHE=%s\n' \
              '/srv/denial-builder/cache/pub'
            printf 'DENIAL_PC_DEPENDENCY_ROOT=%s\n' \
              '/srv/denial-builder/cache/dependencies'
            printf 'DENIAL_PC_RUST_TARGET=%s\n' \
              '/srv/denial-builder/cache/rust-target'
            printf 'DENIAL_FLUTTER_ENGINE_CACHE_ROOT=%s\n' \
              '/srv/denial-builder/cache/flutter-engine'
            printf 'DENIAL_ALPINE_CACHE_ROOT=%s\n' \
              '/srv/denial-builder/cache/alpine'
            printf 'DENIAL_FLUTTER_ENGINE_JOBS=%s\n' '16'
            printf 'EVIDENCE_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-evidence"
            printf 'CANDIDATE_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-candidate"
            printf 'CANDIDATE_ARCHIVE=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-candidate.tar"
            printf 'DENIAL_PC_PACKAGE_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-packages"
            printf 'DENIAL_PC_MAKEPKG_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-makepkg"
            printf 'DENIAL_PC_PACKAGE_INPUT_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-package-input"
            printf 'DENIAL_PC_ALPINE_ROOT=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-alpine"
            printf 'DENIAL_ALPINE_EVIDENCE_FILE=%s\n' \
              "$RUNNER_TEMP/denial-${VALIDATION_BRANCH}-evidence/alpine-build-environment.txt"
          } >>"$GITHUB_ENV"

      - name: Check out the exact pushed commit
        shell: bash
        env:
          DENIAL_CHECKOUT_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          askpass="$RUNNER_TEMP/denial-git-askpass"
          trap 'rm -f -- "$askpass"' EXIT
          umask 077
          # The parameter expansions below are literal askpass-script source.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'case "${1:-}" in' \
            '  *Username*) printf "%s\n" x-access-token ;;' \
            '  *Password*) printf "%s\n" "${DENIAL_CHECKOUT_TOKEN:?}" ;;' \
            '  *) exit 1 ;;' \
            'esac' \
            >"$askpass"
          chmod 0700 "$askpass"

          git init --initial-branch="$VALIDATION_BRANCH" .
          git remote add origin "https://github.com/${REPOSITORY_NAME}.git"
          GIT_ASKPASS="$askpass" \
          GIT_ASKPASS_REQUIRE=force \
          GIT_TERMINAL_PROMPT=0 \
          git -c protocol.version=2 fetch \
            --no-tags \
            origin \
            "$EXPECTED_SHA" \
            '+refs/tags/v*:refs/tags/v*'
          git checkout -B "$VALIDATION_BRANCH" FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git branch --show-current)" = "$VALIDATION_BRANCH"

      - name: Audit source and builder
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 "$EVIDENCE_ROOT"
          actionlint 2>&1 | tee "$EVIDENCE_ROOT/actionlint.txt"
          tools/denial-release source-audit --branch "$VALIDATION_BRANCH" \
            2>&1 | tee "$EVIDENCE_ROOT/source-audit.txt"
          tools/denial-release doctor --ci --branch "$VALIDATION_BRANCH" \
            2>&1 | tee "$EVIDENCE_ROOT/builder-doctor.txt"

      - name: Bootstrap pinned development toolchains
        shell: bash
        run: |
          set -euo pipefail
          tools/denial-pc bootstrap \
            2>&1 | tee "$EVIDENCE_ROOT/bootstrap.txt"

      - name: Build or reuse the locked Flutter engine
        shell: bash
        run: |
          set -euo pipefail
          tools/denial-flutter-engine build \
            --github-env "$GITHUB_ENV" \
            2>&1 | tee "$EVIDENCE_ROOT/flutter-engine.txt"

      - name: Verify packaged Flutter tool snapshot
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask flutter-tool-snapshot \
            2>&1 | tee "$EVIDENCE_ROOT/flutter-tool-snapshot.txt"

      - name: Build Flutter integration-test bundle
        shell: bash
        run: |
          set -euo pipefail
          tools/denial-pc bundle \
            2>&1 | tee "$EVIDENCE_ROOT/integration-test-bundle.txt"

      - name: Run compositor and Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          tools/denial-pc test \
            2>&1 | tee "$EVIDENCE_ROOT/compositor-tests.txt"
          (
            cd dart_shell
            "$DENIAL_PC_DEPENDENCY_ROOT/flutter/bin/flutter" test
          ) 2>&1 | tee "$EVIDENCE_ROOT/flutter-tests.txt"
          (
            cd "$DENIAL_PC_DEPENDENCY_ROOT/flutter/packages/flutter_tools"
            ../../bin/flutter test \
              test/general.shard/dap/flutter_adapter_test.dart
          ) 2>&1 | tee "$EVIDENCE_ROOT/flutter-tool-tests.txt"

      - name: Build candidate packages
        shell: bash
        env:
          DENIAL_PACKAGE_PACKAGER: Doctor Logix <doctor.logix@gmail.com>
          DENIAL_PACKAGE_SKIP_STAGE: "1"
          DENIAL_REBUILD_ENGINE_PACKAGE: "1"
        run: |
          set -euo pipefail
          TIMEFORMAT=$'real_seconds=%3R\nuser_seconds=%3U\nsystem_seconds=%3S\ncpu_percent=%P'
          {
            time cargo xtask ui-development-package
            time tools/denial-pc arch-package
            time tools/denial-pc native-packages
            time tools/denial-pc alpine-package
          } 2>&1 | tee "$EVIDENCE_ROOT/package-build.txt"

      - name: Collect failed build diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          failure_root="$RUNNER_TEMP/denial-$GITHUB_REF_NAME-failure"
          snapshot_root="${XDG_CACHE_HOME:-$HOME/.cache}/denial/pc-build/ui-development/flutter-tools/snapshot-failure"
          install -d -m 0755 "$failure_root"
          if [[ -n "${EVIDENCE_ROOT:-}" && -d "$EVIDENCE_ROOT" ]]; then
            cp -a -- "$EVIDENCE_ROOT" "$failure_root/evidence"
          fi
          if [[ -d "$snapshot_root" && -f "${EVIDENCE_ROOT:-}/flutter-tool-snapshot.txt" ]]; then
            cp -a -- "$snapshot_root" "$failure_root/snapshot-failure"
          fi

      - name: Upload failed build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denial-${{ github.ref_name }}-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/denial-${{ github.ref_name }}-failure
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - name: Assemble candidate and build evidence
        shell: bash
        run: |
          set -euo pipefail
          package_root="$DENIAL_PC_PACKAGE_ROOT"
          install -d -m 0755 \
            "$CANDIDATE_ROOT/packages" \
            "$CANDIDATE_ROOT/evidence/package-metadata"
          cp -a -- "$EVIDENCE_ROOT/." "$CANDIDATE_ROOT/evidence/"

          mapfile -d '' arch_packages < <(
            find "$package_root" \
              -maxdepth 1 \
              -type f \
              -name '*.pkg.tar.zst' \
              -print0 \
              | sort -z
          )
          mapfile -d '' deb_packages < <(
            find "$package_root" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print0 \
              | sort -z
          )
          mapfile -d '' rpm_packages < <(
            find "$package_root" \
              -maxdepth 1 \
              -type f \
              -name '*.rpm' \
              -print0 \
              | sort -z
          )
          mapfile -d '' apk_packages < <(
            find "$package_root" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print0 \
              | sort -z
          )
          if ((${#arch_packages[@]} != 3)); then
            printf 'Expected three Arch packages, found %d\n' \
              "${#arch_packages[@]}" >&2
            exit 1
          fi
          if ((${#deb_packages[@]} != 2)); then
            printf 'Expected two Debian packages, found %d\n' \
              "${#deb_packages[@]}" >&2
            exit 1
          fi
          if ((${#rpm_packages[@]} != 2)); then
            printf 'Expected two RPM packages, found %d\n' \
              "${#rpm_packages[@]}" >&2
            exit 1
          fi
          if ((${#apk_packages[@]} != 2)); then
            printf 'Expected two Alpine packages, found %d\n' \
              "${#apk_packages[@]}" >&2
            exit 1
          fi
          packages=(
            "${arch_packages[@]}"
            "${deb_packages[@]}"
            "${rpm_packages[@]}"
            "${apk_packages[@]}"
          )
          cp --reflink=auto -- "${packages[@]}" "$CANDIDATE_ROOT/packages/"
          cp -a -- \
            "$DENIAL_PC_PACKAGE_INPUT_ROOT/native" \
            "$CANDIDATE_ROOT/native-payload"
          cp -a -- \
            "$DENIAL_PC_PACKAGE_INPUT_ROOT/alpine" \
            "$CANDIDATE_ROOT/alpine-payload"
          (
            cd "$CANDIDATE_ROOT/native-payload"
            mapfile -d '' native_files < <(
              find . -type f ! -name NATIVE-SHA256SUMS -print0 | sort -z
            )
            sha256sum -- "${native_files[@]}" >NATIVE-SHA256SUMS
            sha256sum --check --strict NATIVE-SHA256SUMS
          )
          (
            cd "$CANDIDATE_ROOT/alpine-payload"
            sha256sum --check --strict ALPINE-SHA256SUMS
          )

          for package in "${arch_packages[@]}"; do
            package_name="$(basename -- "$package")"
            bsdtar -xOf "$package" .PKGINFO \
              >"$CANDIDATE_ROOT/evidence/package-metadata/${package_name}.PKGINFO"
            bsdtar -xOf "$package" .BUILDINFO \
              >"$CANDIDATE_ROOT/evidence/package-metadata/${package_name}.BUILDINFO"
          done
          for package in "${deb_packages[@]}"; do
            package_name="$(basename -- "$package")"
            dpkg-deb --field "$package" \
              >"$CANDIDATE_ROOT/evidence/package-metadata/${package_name}.control"
          done
          rpm_query_db="$RUNNER_TEMP/denial-rpm-query-db"
          install -d -m 0755 "$rpm_query_db"
          for package in "${rpm_packages[@]}"; do
            package_name="$(basename -- "$package")"
            rpm --dbpath "$rpm_query_db" -qp --qf \
              $'name=%{NAME}\nversion=%{VERSION}-%{RELEASE}\narchitecture=%{ARCH}\n' \
              "$package" \
              >"$CANDIDATE_ROOT/evidence/package-metadata/${package_name}.rpm"
          done
          for package in "${apk_packages[@]}"; do
            package_name="$(basename -- "$package")"
            bsdtar -xOf "$package" .PKGINFO \
              >"$CANDIDATE_ROOT/evidence/package-metadata/${package_name}.PKGINFO"
          done

          {
            printf 'artifact_class=%s\n' "$CANDIDATE_CLASS"
            printf 'publication_authorized=false\n'
            printf 'release_signing_eligible=%s\n' \
              "$RELEASE_SIGNING_ELIGIBLE"
            printf 'signature_status=unsigned\n'
            printf 'package_release=%s\n' "$DENIAL_PACKAGE_RELEASE"
            printf 'package_formats=arch,deb,rpm,apk\n'
            printf 'native_payload_schema=1\n'
            printf 'alpine_payload_schema=1\n'
            printf 'compile_mode=%s\n' "$CANDIDATE_COMPILE_MODE"
            printf 'build_identity=%s\n' "$DENIAL_BUILD_IDENTITY"
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'source_ref=%s\n' "$GITHUB_REF"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflow_event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'logical_cpus=%s\n' "$(nproc)"
            printf 'rust_build_jobs=%s\n' "${DENIAL_BUILD_JOBS:-$(nproc)}"
            printf 'created_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            uname -a
          } >"$CANDIDATE_ROOT/evidence/provenance.txt"
          if [[ "$VALIDATION_BRANCH" == dev ]]; then
            printf '%s\n' \
              'This is an installable development test candidate built from dev.' \
              'Its package release is 0 and it is ineligible for release signing or publication.' \
              >"$CANDIDATE_ROOT/NOTICE.txt"
          else
            printf '%s\n' \
              'This is an unsigned production candidate built from main.' \
              'Its package release is 0; publication remains forbidden until a signed tag promotes these exact payloads.' \
              'Promotion may change package metadata and install the tag-derived runtime version, but must not rebuild or alter compiled files.' \
              >"$CANDIDATE_ROOT/NOTICE.txt"
          fi
          pacman -Q >"$CANDIDATE_ROOT/evidence/host-packages.txt"
          (
            cd compositor
            rustc -vV
          ) >"$CANDIDATE_ROOT/evidence/rustc.txt"
          "$DENIAL_PC_DEPENDENCY_ROOT/flutter/bin/flutter" \
            --version \
            >"$CANDIDATE_ROOT/evidence/flutter.txt"

          (
            cd "$CANDIDATE_ROOT/packages"
            sha256sum -- *.pkg.tar.zst *.deb *.rpm *.apk >SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          namcap "$CANDIDATE_ROOT"/packages/*.pkg.tar.zst \
            2>&1 | tee "$CANDIDATE_ROOT/evidence/namcap.txt"
          tar \
            --create \
            --file="$CANDIDATE_ARCHIVE" \
            --directory="$CANDIDATE_ROOT" \
            .

      - name: Upload branch validation candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denial-${{ github.ref_name }}-validated-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-${{ github.ref_name }}-candidate.tar
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 7 }}
          compression-level: 0

  verify:
    name: Independently verify candidate artifact
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: archlinux:base-devel

    steps:
      - name: Install verification tools
        shell: bash
        run: >-
          pacman -Syu --needed --noconfirm
          apt createrepo_c dnf dpkg git gnupg jq rpm-tools

      - name: Check out the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source checkout
        shell: bash
        run: |
          test "$(
            git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          )" = "$GITHUB_SHA"

      - name: Download candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: denial-${{ github.ref_name }}-validated-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/denial-${{ github.ref_name }}-candidate-transfer

      - name: Extract candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/denial-${GITHUB_REF_NAME}-candidate"
          candidate_archive="$RUNNER_TEMP/denial-${GITHUB_REF_NAME}-candidate-transfer/denial-${GITHUB_REF_NAME}-candidate.tar"
          install -d -m 0755 "$candidate_root"
          tar \
            --extract \
            --file="$candidate_archive" \
            --directory="$candidate_root" \
            --no-same-owner

      - name: Verify provenance and package contents
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/denial-${{ github.ref_name }}-candidate
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/dev)
              expected_class='development-test-candidate'
              expected_signing_eligibility='false'
              expected_compile_mode='release'
              ;;
            refs/heads/main)
              expected_class='production-release-candidate'
              expected_signing_eligibility='true'
              expected_compile_mode='release'
              ;;
            *)
              printf 'Unsupported validation ref: %s\n' "$GITHUB_REF" >&2
              exit 1
              ;;
          esac
          expected_package_release='0'
          provenance="$CANDIDATE_ROOT/evidence/provenance.txt"
          test -f "$CANDIDATE_ROOT/NOTICE.txt"
          grep -Fxq "artifact_class=$expected_class" "$provenance"
          grep -Fxq 'publication_authorized=false' "$provenance"
          grep -Fxq \
            "release_signing_eligible=$expected_signing_eligibility" \
            "$provenance"
          grep -Fxq 'signature_status=unsigned' "$provenance"
          grep -Fxq \
            "package_release=$expected_package_release" \
            "$provenance"
          grep -Fxq 'package_formats=arch,deb,rpm,apk' "$provenance"
          grep -Fxq 'native_payload_schema=1' "$provenance"
          grep -Fxq 'alpine_payload_schema=1' "$provenance"
          grep -Fxq "compile_mode=$expected_compile_mode" "$provenance"
          grep -Fxq "source_commit=$GITHUB_SHA" "$provenance"
          grep -Fxq "source_ref=$GITHUB_REF" "$provenance"

          mapfile -d '' packages < <(
            find "$CANDIDATE_ROOT/packages" \
              -maxdepth 1 \
              -type f \
              -name '*.pkg.tar.zst' \
              -print0 \
              | sort -z
          )
          if ((${#packages[@]} != 3)); then
            printf 'Expected three candidate Arch packages, found %d\n' \
              "${#packages[@]}" >&2
            exit 1
          fi
          mapfile -d '' deb_packages < <(
            find "$CANDIDATE_ROOT/packages" \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print0 \
              | sort -z
          )
          mapfile -d '' rpm_packages < <(
            find "$CANDIDATE_ROOT/packages" \
              -maxdepth 1 \
              -type f \
              -name '*.rpm' \
              -print0 \
              | sort -z
          )
          mapfile -d '' apk_packages < <(
            find "$CANDIDATE_ROOT/packages" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print0 \
              | sort -z
          )
          if ((${#deb_packages[@]} != 2)); then
            printf 'Expected two candidate Debian packages, found %d\n' \
              "${#deb_packages[@]}" >&2
            exit 1
          fi
          if ((${#rpm_packages[@]} != 2)); then
            printf 'Expected two candidate RPM packages, found %d\n' \
              "${#rpm_packages[@]}" >&2
            exit 1
          fi
          if ((${#apk_packages[@]} != 2)); then
            printf 'Expected two candidate Alpine packages, found %d\n' \
              "${#apk_packages[@]}" >&2
            exit 1
          fi
          (
            cd "$CANDIDATE_ROOT/packages"
            sha256sum --check --strict SHA256SUMS
          )

          denial_packages=0
          engine_packages=0
          ui_development_packages=0
          denial_arch_package=''
          engine_arch_package=''
          denial_version=''
          engine_version=''
          ui_development_version=''
          ui_denial_before="$(
            jq -er \
              '.compatibility.denial_version_before' \
              packaging/arch/ui-development/manifest.json
          )"
          expected_debug_engine_sha="$(
            awk 'NR == 1 { print $1 }' \
              prebuilt/flutter-engine/linux-x64-debug/libflutter_engine.so.sha256
          )"
          expected_profile_engine_sha="$(
            awk 'NR == 1 { print $1 }' \
              prebuilt/flutter-engine/linux-x64-profile/libflutter_engine.so.sha256
          )"
          expected_flutter_tool_sha="$(
            awk 'NR == 1 { print $1 }' \
              prebuilt/flutter-tools/3.44.7/flutter_tools.snapshot.sha256
          )"
          expected_source_lock_sha="$(
            sha256sum prebuilt/flutter-engine/SOURCE_LOCK.json \
              | awk '{ print $1 }'
          )"
          expected_ui_manifest_sha="$(
            sha256sum packaging/arch/ui-development/manifest.json \
              | awk '{ print $1 }'
          )"
          for package in "${packages[@]}"; do
            package_filename="$(basename -- "$package")"
            package_info="$(bsdtar -xOf "$package" .PKGINFO)"
            package_name="$(
              sed -n 's/^pkgname = //p' <<<"$package_info"
            )"
            package_version="$(
              sed -n 's/^pkgver = //p' <<<"$package_info"
            )"
            package_arch="$(
              sed -n 's/^arch = //p' <<<"$package_info"
            )"
            test "$package_arch" = x86_64
            [[ "$package_version" != *dirty* ]]
            [[ "$package_version" == *-"$expected_package_release" ]]

            mtree="$(bsdtar -xOf "$package" .MTREE | gzip -dc)"
            grep -Eq '^/set .*uid=0 .*gid=0' <<<"$mtree"
            if grep -Eq '(^| )(uid|gid)=[1-9][0-9]*' <<<"$mtree"; then
              printf 'Package contains a non-root owner: %s\n' \
                "$package" >&2
              exit 1
            fi

            case "$package_name" in
              denial)
                denial_packages=$((denial_packages + 1))
                denial_version="$package_version"
                denial_arch_package="$package"
                test "$package_filename" = \
                  "denial-${package_version}-x86_64.pkg.tar.zst"
                grep -Fxq \
                  'depend = denial-flutter-engine-abi=3.44.7.denial1' \
                  <<<"$package_info"
                grep -Fxq \
                  'optdepend = denial-ui-development: live Flutter UI editing and hot reload' \
                  <<<"$package_info"
                bsdtar -tf "$package" \
                  | grep -Fxq usr/bin/deniald
                bsdtar -tf "$package" \
                  | grep -Fxq usr/bin/denialctl
                bsdtar -tf "$package" \
                  | grep -Fxq usr/lib/denial/flutter/lib/libapp.so
                if bsdtar -tf "$package" \
                  | grep -Fxq usr/share/denial/version; then
                  printf \
                    'Candidate package predicts a public runtime version: %s\n' \
                    "$package" >&2
                  exit 1
                fi
                ;;
              denial-flutter-engine)
                engine_packages=$((engine_packages + 1))
                engine_version="$package_version"
                engine_arch_package="$package"
                test "$package_filename" = \
                  "denial-flutter-engine-${package_version}-x86_64.pkg.tar.zst"
                grep -Fxq \
                  'provides = denial-flutter-engine-abi=3.44.7.denial1' \
                  <<<"$package_info"
                bsdtar -tf "$package" \
                  | grep -Fxq \
                    usr/lib/denial/flutter/lib/libflutter_engine.so
                bsdtar -tf "$package" \
                  | grep -Fxq usr/lib/denial/flutter/data/icudtl.dat
                test "$(
                  bsdtar -xOf \
                    "$package" \
                    usr/share/denial/flutter-engine/SOURCE_LOCK.json \
                    | sha256sum \
                    | awk '{ print $1 }'
                )" = "$expected_source_lock_sha"
                ;;
              denial-ui-development)
                ui_development_packages=$((ui_development_packages + 1))
                ui_development_version="$package_version"
                ui_package_identity="${package_version%-*}"
                test "$package_filename" = \
                  "denial-ui-development-${package_version}-x86_64.pkg.tar.zst"
                grep -Fxq \
                  'depend = denial-flutter-engine-abi=3.44.7.denial1' \
                  <<<"$package_info"
                grep -Fxq \
                  "depend = denial>=${ui_package_identity}" \
                  <<<"$package_info"
                grep -Fxq \
                  "depend = denial<${ui_denial_before}" \
                  <<<"$package_info"
                bsdtar -tf "$package" \
                  | grep -Fxq usr/bin/denial-ui
                bsdtar -tf "$package" \
                  | grep -Fxq \
                    usr/lib/denial/ui-development/lib/libflutter_engine.so
                bsdtar -tf "$package" \
                  | grep -Fxq \
                    usr/lib/denial/ui-development/profile/lib/libflutter_engine.so
                bsdtar -tf "$package" \
                  | grep -Fxq \
                    usr/lib/denial/ui-development/flutter/bin/cache/flutter_tools.snapshot
                bsdtar -tf "$package" \
                  | grep -Fxq \
                    usr/share/denial/ui-development/manifest.json
                test "$(
                  bsdtar -xOf \
                    "$package" \
                    usr/lib/denial/ui-development/lib/libflutter_engine.so \
                    | sha256sum \
                    | awk '{ print $1 }'
                )" = "$expected_debug_engine_sha"
                test "$(
                  bsdtar -xOf \
                    "$package" \
                    usr/lib/denial/ui-development/profile/lib/libflutter_engine.so \
                    | sha256sum \
                    | awk '{ print $1 }'
                )" = "$expected_profile_engine_sha"
                test "$(
                  bsdtar -xOf \
                    "$package" \
                    usr/lib/denial/ui-development/flutter/bin/cache/flutter_tools.snapshot \
                    | sha256sum \
                    | awk '{ print $1 }'
                )" = "$expected_flutter_tool_sha"
                test "$(
                  bsdtar -xOf \
                    "$package" \
                    usr/share/denial/ui-development/manifest.json \
                    | sha256sum \
                  | awk '{ print $1 }'
                )" = "$expected_ui_manifest_sha"
                test "$(
                  bsdtar -xOf \
                    "$package" \
                    usr/share/denial/ui-development/SOURCE_LOCK.json \
                    | sha256sum \
                    | awk '{ print $1 }'
                )" = "$expected_source_lock_sha"
                ;;
              *)
                printf 'Unexpected package name: %s\n' "$package_name" >&2
                exit 1
                ;;
            esac
          done
          test "$denial_packages" -eq 1
          test "$engine_packages" -eq 1
          test "$ui_development_packages" -eq 1
          test "$engine_version" = "1:${denial_version}"
          test "$ui_development_version" = "$denial_version"
          test -n "$denial_arch_package"
          test -n "$engine_arch_package"

          native_payload="$CANDIDATE_ROOT/native-payload"
          test -d "$native_payload/denial"
          test -d "$native_payload/denial-flutter-engine"
          test -f "$native_payload/metadata.json"
          (
            cd "$native_payload"
            sha256sum --check --strict NATIVE-SHA256SUMS
          )
          mapfile -t native_metadata < <(
            tools/read-denial-native-metadata \
              "$native_payload/metadata.json"
          )
          test "${#native_metadata[@]}" -eq 7
          PACKAGE_VERSION="${native_metadata[0]}"
          PACKAGE_RELEASE="${native_metadata[1]}"
          BUILD_IDENTITY="${native_metadata[2]}"
          SOURCE_DATE_EPOCH="${native_metadata[3]}"
          GLIBC_BASELINE="${native_metadata[4]}"
          FLUTTER_ENGINE_ABI="${native_metadata[5]}"
          FLUTTER_ENGINE_SHA256="${native_metadata[6]}"
          test "$PACKAGE_RELEASE" = "$expected_package_release"
          test "$BUILD_IDENTITY" = "$GITHUB_REF_NAME.g$GITHUB_SHA"
          test "$SOURCE_DATE_EPOCH" = "$(
            git -c safe.directory="$GITHUB_WORKSPACE" \
              show -s --format=%ct "$GITHUB_SHA"
          )"
          grep -Fxq "build_identity=$BUILD_IDENTITY" "$provenance"
          test "$FLUTTER_ENGINE_ABI" = 3.44.7.denial1
          test "$FLUTTER_ENGINE_SHA256" = "$(
            awk 'NR == 1 { print $1 }' \
              prebuilt/flutter-engine/linux-x64-release/libflutter_engine.so.sha256
          )"
          test ! -e "$native_payload/denial/usr/share/denial/version"
          for package_root in denial denial-flutter-engine; do
            (
              cd "$native_payload/$package_root"
              sha256sum --check --strict --quiet \
                "$native_payload/${package_root}.sha256"
            )
          done
          tools/verify-denial-package-payload \
            arch "$denial_arch_package" "$native_payload/denial"
          tools/verify-denial-package-payload \
            arch "$engine_arch_package" \
            "$native_payload/denial-flutter-engine"

          deb_names=()
          for package in "${deb_packages[@]}"; do
            package_name="$(dpkg-deb --field "$package" Package)"
            package_version="$(dpkg-deb --field "$package" Version)"
            package_arch="$(dpkg-deb --field "$package" Architecture)"
            test "$package_arch" = amd64
            test "$package_version" = "$PACKAGE_VERSION-$PACKAGE_RELEASE"
            case "$package_name" in
              denial)
                expected_file="denial_${PACKAGE_VERSION}-${PACKAGE_RELEASE}_amd64.deb"
                expected_root="$native_payload/denial"
                ;;
              denial-flutter-engine)
                expected_file="denial-flutter-engine_${PACKAGE_VERSION}-${PACKAGE_RELEASE}_amd64.deb"
                expected_root="$native_payload/denial-flutter-engine"
                ;;
              *)
                printf 'Unexpected Debian package: %s\n' "$package_name" >&2
                exit 1
                ;;
            esac
            test "$(basename -- "$package")" = "$expected_file"
            tools/verify-denial-package-payload deb "$package" "$expected_root"
            tools/verify-denial-native-package-metadata \
              deb "$package" "$PACKAGE_VERSION" "$PACKAGE_RELEASE" \
              "$FLUTTER_ENGINE_ABI" "$GLIBC_BASELINE"
            deb_names+=("$package_name")
          done
          test "${deb_names[*]}" = 'denial-flutter-engine denial'

          rpm_names=()
          rpm_query_db="$RUNNER_TEMP/denial-rpm-verification-db"
          install -d -m 0755 "$rpm_query_db"
          for package in "${rpm_packages[@]}"; do
            package_name="$(rpm --dbpath "$rpm_query_db" -qp --qf '%{NAME}' "$package")"
            package_version="$(rpm --dbpath "$rpm_query_db" -qp --qf '%{VERSION}-%{RELEASE}' "$package")"
            package_arch="$(rpm --dbpath "$rpm_query_db" -qp --qf '%{ARCH}' "$package")"
            test "$package_arch" = x86_64
            test "$package_version" = "$PACKAGE_VERSION-$PACKAGE_RELEASE"
            case "$package_name" in
              denial)
                expected_file="denial-${PACKAGE_VERSION}-${PACKAGE_RELEASE}.x86_64.rpm"
                expected_root="$native_payload/denial"
                ;;
              denial-flutter-engine)
                expected_file="denial-flutter-engine-${PACKAGE_VERSION}-${PACKAGE_RELEASE}.x86_64.rpm"
                expected_root="$native_payload/denial-flutter-engine"
                ;;
              *)
                printf 'Unexpected RPM package: %s\n' "$package_name" >&2
                exit 1
                ;;
            esac
            test "$(basename -- "$package")" = "$expected_file"
            tools/verify-denial-package-payload rpm "$package" "$expected_root"
            tools/verify-denial-native-package-metadata \
              rpm "$package" "$PACKAGE_VERSION" "$PACKAGE_RELEASE" \
              "$FLUTTER_ENGINE_ABI" "$GLIBC_BASELINE"
            rpm_names+=("$package_name")
          done
          test "${rpm_names[*]}" = 'denial denial-flutter-engine'

          alpine_payload="$CANDIDATE_ROOT/alpine-payload"
          test -d "$alpine_payload/denial"
          test -d "$alpine_payload/denial-flutter-engine"
          test -f "$alpine_payload/metadata.json"
          test -f "$alpine_payload/adapter.txt"
          (
            cd "$alpine_payload"
            sha256sum --check --strict ALPINE-SHA256SUMS
          )
          cmp -- \
            "$native_payload/metadata.json" \
            "$alpine_payload/metadata.json"
          apk_version="$(
            sed -n 's/^apk_package_version=//p' \
              "$alpine_payload/adapter.txt"
          )"
          candidate_revision="${PACKAGE_VERSION#*.r}"
          candidate_revision="${candidate_revision%%.g*}"
          test "$apk_version" = \
            "${PACKAGE_VERSION%%.r*}_git${candidate_revision}"
          [[ "$apk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+_git[0-9]+$ ]]
          apk_names=()
          for package in "${apk_packages[@]}"; do
            if bsdtar -tf "$package" | grep -Eq '^\.SIGN\.'; then
              printf 'Candidate APK is unexpectedly signed: %s\n' \
                "$package" >&2
              exit 1
            fi
            package_info="$(bsdtar -xOf "$package" .PKGINFO)"
            package_name="$(
              sed -n 's/^pkgname = //p' <<<"$package_info"
            )"
            package_version="$(
              sed -n 's/^pkgver = //p' <<<"$package_info"
            )"
            package_arch="$(
              sed -n 's/^arch = //p' <<<"$package_info"
            )"
            test "$package_arch" = x86_64
            test "$package_version" = "$apk_version-r$PACKAGE_RELEASE"
            case "$package_name" in
              denial)
                test "$(basename -- "$package")" = \
                  "denial-${apk_version}-r${PACKAGE_RELEASE}.apk"
                grep -Fxq \
                  "depend = denial-flutter-engine=${apk_version}-r${PACKAGE_RELEASE}" \
                  <<<"$package_info"
                bsdtar -tf "$package" | grep -Fxq usr/bin/deniald
                bsdtar -tf "$package" \
                  | grep -Fxq \
                    usr/lib/denial/alpine/libdenial-resolver-bridge.so.0
                if bsdtar -tf "$package" \
                  | grep -Fxq usr/share/denial/version; then
                  printf 'Candidate APK predicts a public runtime version\n' >&2
                  exit 1
                fi
                ;;
              denial-flutter-engine)
                test "$(basename -- "$package")" = \
                  "denial-flutter-engine-${apk_version}-r${PACKAGE_RELEASE}.apk"
                grep -Fxq \
                  'provides = denial-flutter-engine-abi-3.44.7.denial1' \
                  <<<"$package_info"
                ;;
              *)
                printf 'Unexpected Alpine package: %s\n' "$package_name" >&2
                exit 1
                ;;
            esac
            tools/verify-denial-package-payload \
              apk "$package" "$alpine_payload/$package_name"
            apk_names+=("$package_name")
          done
          test "$(printf '%s\n' "${apk_names[@]}" | sort | paste -sd' ' -)" = \
            'denial denial-flutter-engine'

      - name: Rehearse signed APT and DNF repository generation
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/denial-${{ github.ref_name }}-candidate
        run: |
          set -euo pipefail
          mapfile -t native_metadata < <(
            tools/read-denial-native-metadata \
              "$CANDIDATE_ROOT/native-payload/metadata.json"
          )
          test "${#native_metadata[@]}" -eq 7
          test "${native_metadata[1]}" = 0
          tools/test-denial-repository-generators \
            "$CANDIDATE_ROOT/packages" \
            "${native_metadata[0]}" \
            "${native_metadata[1]}"

      - name: Test guided repository setup state handling
        shell: bash
        run: tools/test-denial-repository-setup

      - name: Record validation result
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            printf '%s\n' \
              'The production-mode main candidate passed independent verification.' \
              'Its exact compiled payloads are eligible for later signed-tag promotion.'
          else
            printf '%s\n' \
              'The installable dev candidate passed independent verification.' \
              'Package release 0 is ineligible for release signing or publication.'
          fi

  authorize:
    name: Authorize branch candidate build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out main with promotion history
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact validated dev promotion
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          PREVIOUS_MAIN_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          mapfile -t commit_and_parents < <(
            git rev-list --parents -n 1 HEAD
          )
          read -r -a revision <<<"${commit_and_parents[0]}"
          if ((${#revision[@]} != 3)); then
            printf \
              'Main promotion must be one merge commit with two parents; found %d parents\n' \
              "$((${#revision[@]} - 1))" >&2
            exit 1
          fi

          previous_main="${revision[1]}"
          validated_dev="${revision[2]}"
          if [[ -n "$PREVIOUS_MAIN_SHA" \
            && "$PREVIOUS_MAIN_SHA" != 0000000000000000000000000000000000000000 ]]; then
            test "$previous_main" = "$PREVIOUS_MAIN_SHA"
          fi
          test "$(git rev-parse 'HEAD^{tree}')" = \
            "$(git rev-parse "${validated_dev}^{tree}")"

          git fetch --no-tags origin \
            '+refs/heads/dev:refs/remotes/origin/dev'
          git merge-base --is-ancestor \
            "$validated_dev" refs/remotes/origin/dev

          workflow_runs="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${REPOSITORY_NAME}/actions/workflows/branch-validation.yml/runs?branch=dev&event=push&status=completed&per_page=100"
          )"
          validation_run="$(
            jq -er \
              --arg source "$validated_dev" \
              '[
                .workflow_runs[]
                | select(
                    .head_sha == $source
                    and .head_branch == "dev"
                    and .event == "push"
                    and .conclusion == "success"
                  )
              ]
              | first
              | .id' \
              <<<"$workflow_runs"
          )"

          {
            printf '### Exact dev promotion verified\n\n'
            printf -- '- Main merge: %s\n' "$EXPECTED_MAIN_SHA"
            printf -- '- Validated dev commit: %s\n' "$validated_dev"
            printf -- '- Successful dev workflow: [%s](https://github.com/%s/actions/runs/%s)\n' \
              "$validation_run" "$REPOSITORY_NAME" "$validation_run"
            printf -- '- Main and validated dev tree: %s\n' \
              "$(git rev-parse 'HEAD^{tree}')"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Authorize development candidate
        if: github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev
          printf '%s\n' \
            'Development source accepted for independent candidate validation.' \
            >>"$GITHUB_STEP_SUMMARY"
