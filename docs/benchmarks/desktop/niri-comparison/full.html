<!doctype html><html><body style="margin:0;overflow:hidden;background:#000">
<canvas id="c"></canvas>
<script>
// Stand-in for a fullscreen game: the whole canvas changes every frame.
const c = document.getElementById('c'), g = c.getContext('2d');
function size() { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px'; }
addEventListener('resize', size); size();
let n = 0;
function frame(t) {
  n++;
  const w = c.width, h = c.height;
  g.fillStyle = `hsl(${(t / 20) % 360},60%,25%)`; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 60; i++) {
    const a = t / 900 + i * 0.37;
    g.fillStyle = `hsl(${(i * 23 + t / 10) % 360},80%,60%)`;
    g.beginPath(); g.arc(w / 2 + Math.cos(a * 1.3) * w * 0.4, h / 2 + Math.sin(a) * h * 0.4, 40 + 30 * Math.sin(a * 2), 0, 7); g.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(() => { console.log('bench-fps ' + n); n = 0; }, 1000);
</script></body></html>
