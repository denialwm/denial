<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Denial Settings — 平铺布局</title>
<style>
  :root {
    --accent: #2f9e6f;
    --accent-soft: rgba(47, 158, 111, .13);
    --bg: #f3f4f8;
    --card: #ffffff;
    --sidebar: #eaecf2;
    --text: #1e2229;
    --muted: #6f7681;
    --faint: #9aa1ab;
    --line: #e6e8ee;
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center;
    background: #0f1115; color: var(--text);
    font-family: "Noto Sans SC", "Noto Sans CJK SC", system-ui, sans-serif;
    overflow: hidden; -webkit-user-select: none; user-select: none;
  }
  .device {
    width: 1700px; height: 1067px;
    display: grid; grid-template-columns: 272px 1fr;
    background: var(--bg);
    border-radius: 26px; overflow: hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,.55);
    transform-origin: center;
    transform: scale(var(--scale, 1));
  }

  /* ---------- sidebar ---------- */
  .sidebar {
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    padding: 22px 14px 16px;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 0 12px 18px;
    font-size: 19px; font-weight: 700;
  }
  .brand svg { width: 22px; height: 22px; }
  .scroll { flex: 1; overflow: hidden; padding: 0 2px; }
  .group { margin-bottom: 14px; }
  .group-label {
    padding: 0 12px 6px;
    font-size: 11px; font-weight: 600;
    letter-spacing: .08em;
    color: var(--faint);
  }
  .item {
    display: flex; align-items: center; gap: 11px;
    height: 40px; padding: 0 12px;
    border-radius: 11px;
    font-size: 13.5px; color: var(--muted);
  }
  .item svg { width: 17px; height: 17px; flex: none; }
  .item.active {
    background: #dfe4ea; color: var(--text); font-weight: 600;
  }
  .sidebar-foot { padding-top: 8px; border-top: 1px solid var(--line); }

  /* ---------- content ---------- */
  .content { min-width: 0; display: flex; flex-direction: column; }
  .header {
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .header-inner {
    max-width: 1180px; margin: 0 auto;
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 24px;
    padding: 30px 0 20px;
  }
  .title { font-size: 27px; font-weight: 700; letter-spacing: -.02em; }
  .subtitle { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .actions { display: flex; gap: 8px; padding-top: 4px; }
  .action {
    display: inline-flex; align-items: center; gap: 7px;
    height: 36px; padding: 0 15px;
    border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--text);
    font-size: 12.5px; font-weight: 500;
  }
  .action svg { width: 15px; height: 15px; color: var(--muted); }

  .body { flex: 1; overflow: hidden; padding: 24px 40px 28px; }
  .col { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 26px;
  }
  .card-head {
    display: flex; align-items: center; gap: 9px;
    font-size: 14.5px; font-weight: 700;
  }
  .card-head svg { width: 17px; height: 17px; color: var(--accent); }
  .card-desc { margin-top: 5px; font-size: 12px; color: var(--muted); }

  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px; padding: 16px 0;
    border-top: 1px solid var(--line);
  }
  .row:first-of-type { margin-top: 14px; }
  .row .label { font-size: 13.5px; font-weight: 550; }
  .row .hint { margin-top: 3px; font-size: 11.5px; color: var(--muted); }

  .wallpaper-row { display: flex; align-items: center; gap: 24px; margin-top: 16px; }
  .preview {
    width: 252px; height: 142px; flex: none;
    border-radius: 14px;
    background:
      radial-gradient(240px 160px at 15% 80%, rgba(80, 70, 190, .85), transparent 60%),
      radial-gradient(260px 180px at 85% 20%, rgba(30, 120, 170, .8), transparent 60%),
      linear-gradient(135deg, #120f2e, #241a4a 55%, #0c1226);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .wallpaper-info { min-width: 0; }
  .wallpaper-info .big { font-size: 14px; font-weight: 600; }
  .wallpaper-info .small { margin-top: 5px; font-size: 12px; color: var(--muted); }
  .count { color: var(--faint); margin-left: 6px; }

  .segmented { display: flex; gap: 8px; }
  .seg {
    height: 34px; padding: 0 16px;
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: 10px; border: 1px solid var(--line);
    background: #f6f7f9; color: var(--muted);
    font-size: 12.5px;
  }
  .seg.selected {
    background: var(--accent-soft); border-color: rgba(47,158,111,.55);
    color: #1f7f58; font-weight: 600;
  }
  .dot {
    width: 15px; height: 15px; border-radius: 999px;
    background: var(--accent); box-shadow: inset 0 0 0 3px rgba(255,255,255,.75);
  }
  .swatches { display: flex; gap: 10px; align-items: center; }
  .swatch { width: 26px; height: 26px; border-radius: 999px; }
  .swatch.selected { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); }

  .switch {
    width: 46px; height: 27px; border-radius: 999px;
    background: var(--accent); position: relative;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; right: 3px;
    width: 21px; height: 21px; border-radius: 999px; background: #fff;
  }
  .slider { width: 300px; height: 6px; border-radius: 999px; background: #e2e5ea; position: relative; }
  .slider::before { content: ""; position: absolute; inset: 0 38% 0 0; border-radius: 999px; background: var(--accent); }
  .slider::after {
    content: ""; position: absolute; top: 50%; left: 62%;
    width: 20px; height: 20px; border-radius: 999px; background: #fff;
    transform: translate(-50%, -50%);
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  .select {
    display: inline-flex; align-items: center; justify-content: space-between;
    gap: 18px; min-width: 190px; height: 38px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 10px;
    background: #f6f7f9; font-size: 12.5px; color: var(--text);
  }
  .select svg { width: 15px; height: 15px; color: var(--faint); }
</style>
</head>
<body>

<div class="device">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16v6H4z"/><path d="M4 14h16v6H4z"/><path d="M8 7h.01M8 17h.01"/></svg>
      设置
    </div>

    <div class="scroll">
      <div class="group">
        <div class="group-label">个性化</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>你</div>
        <div class="item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>外观</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h10"/></svg>语言</div>
      </div>

      <div class="group">
        <div class="group-label">输入</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>键盘</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 7v4"/></svg>鼠标和触控板</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M8 10h.01M12 10h.01M16 10h.01M8 14h8"/></svg>快捷键</div>
      </div>

      <div class="group">
        <div class="group-label">桌面</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m8 9 3 3-3 3M13 15h4"/></svg>应用环境</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 1 16 0"/><path d="M12 12l4-3"/><path d="M4 12h2M18 12h2"/></svg>动画</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>桌面布局</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>浮层</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>锁屏</div>
      </div>

      <div class="group">
        <div class="group-label">系统</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 5 6v5c0 4.4 2.8 8.4 7 10 4.2-1.6 7-5.6 7-10V6Z"/></svg>权限</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9Z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>音频</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>显示器与视频</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 18 0"/><path d="M6 15a6 6 0 0 1 12 0"/><path d="M9 18a3 3 0 0 1 6 0"/></svg>网络</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 7 10 10M17 7 7 17"/><path d="M12 3 7 8v6l5 5 5-5V8Z"/></svg>蓝牙</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v9"/><path d="M6 6a8 8 0 1 0 12 0"/></svg>电源</div>
        <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 6-4 6 4 6M16 6l4 6-4 6"/></svg>开发者</div>
      </div>
    </div>

    <div class="sidebar-foot">
      <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>关于</div>
    </div>
  </aside>

  <main class="content">
    <header class="header">
      <div class="header-inner">
      <div>
        <div class="title">外观</div>
        <div class="subtitle">让桌面更合你的心意。</div>
      </div>
      <div class="actions">
        <button class="action">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          重置页面
        </button>
      </div>
      </div>
    </header>

    <div class="body">
      <div class="col">
        <section class="card">
          <div class="card-head">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>
            壁纸
          </div>
          <div class="wallpaper-row">
            <div class="preview"></div>
            <div class="wallpaper-info">
              <div class="big">已应用的壁纸</div>
              <div class="small">显示在 Home 与锁屏上的图像<span class="count">·</span></div>
              <div class="small">显示器 DSI-1<span class="count">·</span>2 个应用使用自定义壁纸</div>
            </div>
            <div style="margin-left:auto">
              <button class="action">更改</button>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z"/></svg>
            主题
          </div>
          <div class="row">
            <div>
              <div class="label">配色方案</div>
              <div class="hint">Denial 与支持的应用使用同一套配色。</div>
            </div>
            <div class="segmented">
              <div class="seg"><span class="dot" style="background:#23262c"></span>深色</div>
              <div class="seg selected">浅色</div>
              <div class="seg">无偏好</div>
            </div>
          </div>
          <div class="row">
            <div>
              <div class="label">强调色</div>
              <div class="hint">按钮、开关与选中状态使用的颜色。</div>
            </div>
            <div class="swatches">
              <div class="swatch selected" style="background:#2f9e6f"></div>
              <div class="swatch" style="background:#3b82f6"></div>
              <div class="swatch" style="background:#8b5cf6"></div>
              <div class="swatch" style="background:#f97316"></div>
              <div class="swatch" style="background:#e11d48"></div>
              <div class="swatch" style="background:#0f766e"></div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
            字体
          </div>
          <div class="row">
            <div>
              <div class="label">界面字体</div>
              <div class="hint">应用到 Denial 与支持的主题感知应用。</div>
            </div>
            <div class="select">Noto Sans SC
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </div>
          </div>
          <div class="row">
            <div>
              <div class="label">圆角</div>
              <div class="hint">面板、卡片与按钮的圆角大小。</div>
            </div>
            <div class="slider"></div>
          </div>
        </section>

      </div>
    </div>
  </main>
</div>

<script>
  const device = document.getElementById('device');
  function fit() {
    const scale = Math.min(window.innerWidth / 1780, window.innerHeight / 1147);
    device.style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
