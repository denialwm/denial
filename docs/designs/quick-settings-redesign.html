<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Denial Quick Settings — Redesign</title>
<style>
  :root {
    --accent: #8bd5a3;
    --accent-strong: #64c98a;
    --accent-ink: #0c2417;
    --panel: rgba(22, 24, 32, 0.58);
    --card: rgba(255, 255, 255, 0.075);
    --card-hover: rgba(255, 255, 255, 0.12);
    --card-border: rgba(255, 255, 255, 0.12);
    --text: #f2f4f8;
    --muted: rgba(242, 244, 248, 0.62);
    --faint: rgba(242, 244, 248, 0.38);
    --radius-xl: 28px;
    --radius-lg: 22px;
    --radius-md: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    display: grid;
    place-items: center;
    background: #101116;
    font-family: "Noto Sans SC", "Noto Sans CJK SC", system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  /* ---------- device canvas ---------- */
  .device {
    position: relative;
    width: 1600px;
    height: 1000px;
    border-radius: 34px;
    overflow: hidden;
    background:
      radial-gradient(1100px 700px at 18% 8%, #2c4a45 0%, transparent 55%),
      radial-gradient(900px 600px at 88% 90%, #3a3350 0%, transparent 60%),
      linear-gradient(135deg, #1b2430 0%, #242a38 45%, #2d2733 100%);
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55);
    transform-origin: center;
  }
  .wallpaper {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 600px at 22% 18%, rgba(139, 213, 163, 0.22), transparent 60%),
      radial-gradient(700px 500px at 82% 78%, rgba(160, 140, 255, 0.20), transparent 62%),
      radial-gradient(500px 400px at 60% 30%, rgba(255, 210, 140, 0.10), transparent 70%);
    filter: blur(8px);
  }

  /* ---------- top status bar ---------- */
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 34px;
    font-size: 15px;
    color: var(--muted);
    z-index: 20;
  }
  .statusbar .left, .statusbar .right { display: flex; align-items: center; gap: 18px; }
  .statusbar .left { font-weight: 600; letter-spacing: 0.02em; }
  .statusbar .right { gap: 14px; }
  .battery {
    display: flex; align-items: center; gap: 7px;
    font-variant-numeric: tabular-nums;
  }
  .battery .shell {
    width: 26px; height: 13px; border: 1.5px solid rgba(255,255,255,0.5);
    border-radius: 4px; padding: 1.5px; position: relative;
  }
  .battery .shell::after {
    content: ""; position: absolute; right: -4px; top: 3px;
    width: 2.5px; height: 5px; border-radius: 0 2px 2px 0;
    background: rgba(255,255,255,0.5);
  }
  .battery .fill {
    height: 100%; width: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent-strong), var(--accent));
  }

  /* ---------- shade ---------- */
  .shade {
    position: absolute; inset: 52px 0 0 0;
    padding: 34px 44px 30px;
    background: var(--panel);
    backdrop-filter: blur(46px) saturate(150%);
    -webkit-backdrop-filter: blur(46px) saturate(150%);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.55fr);
    gap: 34px;
    z-index: 10;
  }
  @keyframes shade-in {
    from { opacity: 0; transform: translateY(-18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- left column ---------- */
  .left-col { display: flex; flex-direction: column; gap: 24px; min-width: 0; order: 2; padding-bottom: 64px; }

  .hero {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 6px 4px 0;
  }
  .clock .time {
    font-size: 64px; line-height: 0.95; font-weight: 600;
    letter-spacing: -0.03em;
  }
  .clock .date { margin-top: 10px; font-size: 16px; color: var(--muted); }

  .hero-actions { display: flex; gap: 12px; }
  .icon-btn {
    width: 50px; height: 50px; border-radius: 16px;
    display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--card-border);
    color: var(--text); cursor: pointer;
    transition: background 140ms ease, transform 140ms ease;
  }
  .icon-btn:hover { background: var(--card-hover); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 21px; height: 21px; }

  /* ---------- quick tiles ---------- */
  .tiles {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }
  .tile {
    position: relative;
    min-height: 108px;
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease,
                transform 120ms ease, box-shadow 160ms ease;
    overflow: hidden;
  }
  .tile:hover { background: var(--card-hover); }
  .tile:active { transform: scale(0.975); }
  .tile .tile-icon { width: 26px; height: 26px; opacity: 0.95; }
  .tile .tile-title { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  .tile .tile-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .tile .tile-head { display: flex; align-items: center; justify-content: space-between; }
  .tile .chev { opacity: 0.5; width: 16px; height: 16px; }

  .tile.on {
    background: linear-gradient(145deg, var(--accent) 0%, var(--accent-strong) 100%);
    border-color: transparent;
    color: var(--accent-ink);
    box-shadow: 0 10px 26px rgba(100, 201, 138, 0.24);
  }
  .tile.on .tile-sub { color: rgba(12, 36, 23, 0.68); }
  .tile.on .chev { opacity: 0.55; }

  /* wide tiles */
  .tiles .span-2 { grid-column: span 2; }
  .tiles .span-3 { grid-column: span 3; }

  /* ---------- sliders ---------- */
  .sliders { display: flex; flex-direction: column; gap: 16px; }
  .slider-card {
    border-radius: var(--radius-lg);
    background: var(--card);
    border: 1px solid var(--card-border);
    padding: 16px 20px 18px;
  }
  .slider-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .slider-head .label {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 600;
  }
  .slider-head .label svg { width: 20px; height: 20px; opacity: 0.9; }
  .slider-head .value { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 30px; background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 10px; border-radius: 999px;
    background: linear-gradient(90deg,
      var(--accent-strong) 0%, var(--accent) var(--p, 60%),
      rgba(255,255,255,0.14) var(--p, 60%), rgba(255,255,255,0.14) 100%);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 26px; height: 26px; margin-top: -8px;
    border-radius: 50%; background: #ffffff;
    border: 4px solid var(--accent-strong);
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  input[type="range"]::-moz-range-track {
    height: 10px; border-radius: 999px;
    background: rgba(255,255,255,0.14);
  }
  input[type="range"]::-moz-range-progress {
    height: 10px; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent-strong), var(--accent));
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: #ffffff; border: 4px solid var(--accent-strong);
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }

  /* ---------- right column : notifications ---------- */
  .right-col {
    display: flex; flex-direction: column; min-width: 0; order: 1;
    border-radius: var(--radius-xl);
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.07);
    padding: 22px 22px 18px;
  }
  .notif-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .notif-head h2 { font-size: 17px; font-weight: 600; }
  .notif-head .clear {
    font-size: 13px; color: var(--muted); cursor: pointer;
    padding: 6px 12px; border-radius: 999px;
    transition: background 140ms ease, color 140ms ease;
  }
  .notif-head .clear:hover { background: var(--card-hover); color: var(--text); }

  .notif-list { display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .notif {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 15px 16px;
    border-radius: var(--radius-md);
    background: var(--card);
    border: 1px solid var(--card-border);
    transition: background 140ms ease, transform 120ms ease;
    cursor: pointer;
  }
  .notif:hover { background: var(--card-hover); }
  .notif:active { transform: scale(0.99); }
  .notif .app-icon {
    width: 40px; height: 40px; border-radius: 12px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--accent), var(--accent-strong));
    color: var(--accent-ink);
  }
  .notif .app-icon svg { width: 20px; height: 20px; }
  .notif .app-icon.alt-1 { background: linear-gradient(145deg, #ff9d9d, #ff6b8a); color: #2a0a12; }
  .notif .app-icon.alt-2 { background: linear-gradient(145deg, #9db8ff, #6b8aff); color: #0a1230; }
  .notif .body { min-width: 0; flex: 1; }
  .notif .meta { display: flex; justify-content: space-between; gap: 12px; }
  .notif .app { font-size: 12px; color: var(--muted); }
  .notif .time { font-size: 12px; color: var(--faint); flex: none; }
  .notif .title { font-size: 14px; font-weight: 600; margin-top: 3px; }
  .notif .text {
    font-size: 13px; color: var(--muted); margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .empty {
    margin: auto; text-align: center; color: var(--faint);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .empty svg { width: 42px; height: 42px; opacity: 0.5; }
  .empty span { font-size: 13px; }

  /* ---------- footer ---------- */
  .shade-foot {
    position: absolute; right: 44px; bottom: 22px;
    display: flex; gap: 10px;
  }
  .foot-btn {
    height: 44px; padding: 0 18px; border-radius: 14px;
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--card-border);
    color: var(--muted); font-size: 13px; cursor: pointer;
    transition: background 140ms ease, color 140ms ease;
  }
  .foot-btn:hover { background: var(--card-hover); color: var(--text); }
  .foot-btn svg { width: 17px; height: 17px; }
  .foot-btn.power:hover { color: #ffb4b4; }

  /* scale to viewport */
  .device { transform: scale(var(--scale, 1)); }
</style>
</head>
<body>

<script>
  // scale the device to fit the viewport
  const device = document.getElementById('device');
  function fit() {
    const s = Math.min(window.innerWidth / 1680, window.innerHeight / 1080);
    device.style.setProperty('--scale', s);
  }
  window.addEventListener('resize', fit);
  fit();

  // toggle tiles
  document.querySelectorAll('.tile').forEach((tile) => {
    tile.addEventListener('click', () => {
      tile.classList.toggle('on');
      const sub = tile.querySelector('.tile-sub');
      if (sub && !sub.dataset.static) {
        // simple state text for toggles without a fixed subtitle
      }
    });
  });

  // slider percentages
  document.querySelectorAll('input[type="range"]').forEach((range) => {
    const update = () => {
      range.style.setProperty('--p', range.value + '%');
      const value = range.closest('.slider-card')?.querySelector('.value');
      if (value) value.textContent = range.value + '%';
    };
    range.addEventListener('input', update);
    update();
  });

  function clearNotifications() {
    const list = document.getElementById('notifs');
    list.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span>暂无新通知</span>
      </div>`;
  }
</script>
</body>
