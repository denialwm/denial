# Physical placement for the current Denial development workstation.
# NAME=X,Y,REFRESH_HZ. The refresh field is optional; when omitted Denial
# selects the fastest mode at the connector's native resolution.
DP-5=0,0,200
DP-4=2560,0,180

# Shell system bar: system_bar=SIDE,THICKNESS[,OUTPUT] or system_bar=hidden.
# SIDE is top|bottom|left|right, THICKNESS is logical pixels, and OUTPUT is a
# connector name (omitted or "auto" follows the render ticker output).
# Without this entry Denial shows a 32-pixel top bar on the ticker output.
# The same spec is available as the --system-bar command-line argument.
system_bar=top,32,DP-5

# Logical pixels between a maximized window and every output edge the bar
# does not occupy (0 disables; defaults to 10 when omitted). Also available
# as --maximize-padding.
maximize_padding=10
