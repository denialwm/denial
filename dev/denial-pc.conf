# Isolated PC configuration. The normal ~/.config/hypr session is not sourced.
monitor = , preferred, auto, 1
monitor = DP-5, 2560x1440@200, 0x0, 1
monitor = DP-4, preferred, 2560x0, 1

env = DENIA_FRAME_TIMING_OVERLAY,0
env = DENIA_IMPORTED_FRAME_TIMING_OVERLAY,0
env = DENIA_SHELL_PROFILE,DESKTOP
env = DENIAL_SYSTEM_BAR_MONITOR,DP-5
env = DENIAL_SYSTEM_BAR_SIDE,left

$terminal = foot

input {
    kb_layout = us
    follow_mouse = 1
}

cursor {
    default_monitor = DP-5
    invisible = true
}

general {
    layout = monocle
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

# Flutter presents application windows as independently movable desktop
# surfaces. Put those windows in Hyprland's floating layout before their
# initial geometry is published.
windowrule {
    name = denial-floating-clients
    match:class = negative:^(denia-home|denia-systemui.*)$
    # Windows Hyprland already considers floating include dialogs, transient
    # windows, fixed-size clients, and popup-like surfaces. Preserve their
    # requested geometry; only ordinary desktop windows receive the default.
    match:float = false

    float = yes
    size = 1120 700
    center = yes
}

decoration {
    rounding = 0
}

animations {
    enabled = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
}

debug {
    disable_logs = false
}

bind = SUPER, Return, exec, $terminal
# Lock through deniald's process-lifetime authentication controller. The p
# flag keeps this security action available through client shortcut inhibitors.
bindp = SUPER, L, denial, session:lock
# Open Applications only when Super is tapped on its own. A release bind lets
# normal Super chords shadow this action instead of opening both destinations.
bindpr = SUPER, SUPER_L, denial, shell:applications
bindpr = SUPER, SUPER_R, denial, shell:applications
# Open Overview and release an application cursor grab first, if present. The
# p flag keeps this compositor-owned bind active through shortcut inhibition.
bindp = SUPER, A, denial, shell:overview
# SUPER+TAB starts a compositor-owned MRU switch session. The transparent
# release binds cannot be shadowed by TAB, so releasing either Super key always
# commits the highlighted window while a pure Super tap still opens Apps.
bindp = SUPER, TAB, denial, shell:window-switch-next
bindprt = SUPER, SUPER_L, denial, shell:window-switch-end
bindprt = SUPER, SUPER_R, denial, shell:window-switch-end
bind = SUPER, Q, killactive
bindp = SUPER, M, denial, window:minimize
bindp = SUPER, F, denial, window:toggle-fullscreen
bind = SUPER, P, pin
bindp = SUPER, LEFT, denial, window:move-monitor-left
bindp = SUPER, RIGHT, denial, window:move-monitor-right
bind = SUPER, K, denial, window:close
bind = SUPER, Escape, exit
bind = SUPER SHIFT, E, exit
bind = SUPER SHIFT, R, exec, hyprctl denial-reload
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Hardware volume controls use deniald's persistent native libpulse
# connection; no per-detent helper process is spawned.
bindle = , XF86AudioRaiseVolume, denial, audio:volume-up
bindle = , XF86AudioLowerVolume, denial, audio:volume-down
bindl = , XF86AudioMute, denial, audio:mute

# With Super held, both the keyboard's volume wheel (XF86 audio events) and a
# mouse wheel adjust the output under the pointer. The dispatcher queues native
# DDC work; input delivery never waits for an I2C transaction.
bindle = SUPER, XF86AudioRaiseVolume, denial, brightness:up
bindle = SUPER, XF86AudioLowerVolume, denial, brightness:down
bindl = SUPER, mouse_up, denial, brightness:up
bindl = SUPER, mouse_down, denial, brightness:down
