# Denial machine configuration
#
# The launcher automatically selects the connected boot GPU. Override it when
# a machine routes its displays through another DRM device:
# DENIAL_DRM_DEVICE=/dev/dri/by-path/pci-0000:01:00.0-card
# When display and rendering use different DRM devices, keep KMS on the card
# above and select the GPU's render node independently:
# DENIAL_RENDER_DEVICE=/dev/dri/renderD128
# Display engines that require scanout storage allocated on the KMS device can
# use its dumb allocator while EGL imports and renders through the render node.
# The modifier must be supported by both KMS and EGL. Extra rows reserve any
# driver-specific body/header storage beyond the visible image:
# DENIAL_DUMB_SCANOUT_MODIFIER=0x0800000000000062
# DENIAL_DUMB_SCANOUT_EXTRA_ROWS=128
#
# Alternate package or configuration paths. Without an output override, the
# launcher initializes and uses $XDG_CONFIG_HOME/denial/outputs.conf. An
# override must be a session-user-writable file in a writable directory:
# DENIAL_FLUTTER_BUNDLE=/usr/lib/denial/flutter
# DENIAL_OUTPUT_CONFIG=/home/example/.config/denial/outputs.conf
#
# Denial renders with its compositor-integrated Impeller GLES backend by
# default. If a driver-specific rendering issue needs the retained
# Skia/Ganesh fallback, select it explicitly and restart the session:
# DENIA_FLUTTER_RENDERER=skia
#
# Optional live Flutter UI development overrides. Without these, Denial uses
# the current user's persisted workspace and
# $XDG_CACHE_HOME/denial/ui-development/debug/bundle:
# DENIAL_FLUTTER_DEBUG_BUNDLE=/home/example/.cache/denial/ui-development/debug/bundle
# DENIAL_FLUTTER_UI_WORKSPACE=/home/example/Projects/denial-ui
#
# The PC package defaults to the desktop shell. Keep the mobile shell available
# for explicit development sessions with:
# DENIA_SHELL_PROFILE=mobile
#
# Native logging filter:
# DENIAL_RUST_LOG=deniald=debug,smithay=info
#
# Emergency CPU-scheduling opt-out. Normal sessions use non-fatally guarded
# SCHED_RR for the compositor plus Flutter display/raster threads, with an
# RTKit high-priority fallback on hosts that impose a finite realtime limit:
# export DENIAL_NO_RT=1
