# Denial machine configuration
#
# The launcher automatically selects the connected boot GPU. Override it when
# a machine routes its displays through another DRM device:
# DENIAL_DRM_DEVICE=/dev/dri/by-path/pci-0000:01:00.0-card
# Denial renders on the GPU that drives the displays. To render on another GPU,
# such as a laptop's dedicated one, keep KMS on the card above and name that
# GPU's render node. Every frame then crosses between the GPUs, and the
# dedicated GPU stays awake: it costs more power than it saves.
# DENIAL_RENDER_DEVICE=/dev/dri/renderD128
#
# A display driver can finish loading after the session starts. The launcher
# waits up to this many seconds for a card with a connected screen (or for the
# devices configured above), then chooses from what is present. 0 never waits:
# DENIAL_DISPLAY_WAIT=30
#
# VMware's vmwgfx render path can expose KMS without a usable accelerated
# GBM/EGL display. Denial automatically selects Mesa's software GBM renderer
# for vmwgfx in that case. Set this only to override the automatic policy for
# diagnostics (0 retries acceleration; 1 forces software rendering):
# LIBGL_ALWAYS_SOFTWARE=0
#
# The launcher derives Denial's binaries and Flutter bundle from its installed
# package prefix. Alternate package layouts may override the bundle explicitly.
# Without an output override, the launcher uses
# $XDG_CONFIG_HOME/denial/outputs.conf when present, then the system default.
# A writable regular file is live state. A read-only file or symlink is
# declarative input synchronized to $XDG_STATE_HOME/denial/outputs.conf, so a
# Home Manager link into the Nix store is supported. An explicit override may
# likewise be either mutable state or a declarative source:
# DENIAL_FLUTTER_BUNDLE=/opt/denial/lib/denial/flutter
# DENIAL_OUTPUT_CONFIG=/home/example/.config/denial/outputs.conf
#
# Denial renders the shell and composes output frames with Vulkan, or does
# both with GLES on a GPU Vulkan cannot open. Render both with GLES on any
# GPU with:
# export DENIAL_NO_VULKAN=1
#
# It copies what earlier frames changed from the buffer shown last instead
# of drawing it again. Where memory bandwidth is scarcer than shading,
# drawing it again may cost less:
# export DENIAL_COMPOSER_CATCH_UP=redraw
#
# Denial uses an Impeller-only Slimpeller engine. Ganesh and Graphite are not
# compiled into the packaged runtime.
#
# Xwayland renders at the exact fractional output density by default. Restore
# integer-upscale compatibility for applications that cannot handle
# fractional X11 DPI with:
# DENIAL_XWAYLAND_SCALE_MODE=integer
#
# Qt applications use Denial's colour-scheme portal through Qt's standard
# portal-backed platform theme provider. Override its provider explicitly, or
# assign an empty value to restore Qt's toolkit/platform default:
# QT_QPA_PLATFORMTHEME=kde
# QT_QPA_PLATFORMTHEME=
#
# Optional live Flutter UI development overrides. Without these, Denial uses
# the current user's persisted workspace and
# $XDG_CACHE_HOME/denial/ui-development/debug/bundle:
# DENIAL_FLUTTER_DEBUG_BUNDLE=/home/example/.cache/denial/ui-development/debug/bundle
# DENIAL_FLUTTER_UI_WORKSPACE=/home/example/Projects/denial-ui
#
# The PC package defaults to the desktop shell. Keep the mobile shell available
# for explicit development sessions with:
# DENIAL_SHELL_PROFILE=mobile
#
# Native logging filter:
# DENIAL_RUST_LOG=denial=debug,smithay=info
#
# Emergency CPU-scheduling opt-out. Normal sessions use non-fatally guarded
# SCHED_RR for the compositor plus Flutter display/raster threads, with an
# RTKit high-priority fallback on hosts that impose a finite realtime limit:
# export DENIAL_NO_RT=1
#
# Denial runs its own PolicyKit authentication agent by default. If another
# agent is already registered for the session, Denial logs a warning and leaves
# it in charge. A service that starts its own agent a little later would lose
# that race, so turn Denial's agent off when you run one yourself:
# DENIAL_POLKIT_AGENT=0
