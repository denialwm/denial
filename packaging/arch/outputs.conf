# Denial system output configuration template
#
# When no per-user source exists, the launcher synchronizes this declarative
# input to $XDG_STATE_HOME/denial/outputs.conf. Denial persists display changes
# in that writable state. The state is retained while this source is unchanged
# and refreshed when the source changes. A writable regular file at
# $XDG_CONFIG_HOME/denial/outputs.conf remains direct mutable state; a symlink
# or read-only file there is treated as declarative input in the same way.
#
# With no connector entries, Denial discovers connected outputs, places them
# automatically, and selects the fastest mode at each native resolution.
#
# Pin connector placement separately from its exact mode. Exact-mode refresh
# values are millihertz, so 60000 means 60 Hz:
# eDP-1=0,0
# mode=eDP-1,1920,1080,60000
# DP-1=1920,0
# mode=DP-1,2560,1440,144000
#
# Set fractional scale independently:
# scale=eDP-1,1.5
#
# Choose the primary display. When omitted, Denial uses the connected output
# with the highest refresh rate:
# primary=eDP-1
#
# Rotate an output clockwise. Supported transforms are normal, 90, 180, 270,
# flipped, flipped-90, flipped-180, and flipped-270:
# transform=eDP-1,90
#
# Enable variable refresh on an output with:
# vrr=DP-1
#
# The system bar follows the render-ticker output by default. Examples:
# system_bar=top,32
# system_bar=bottom,40,eDP-1
# system_bar=hidden
#
# Extra logical pixels around maximized windows (default: 10):
# maximize_padding=10
