# Denial portal routing
#
# Denial owns its application appearance preference. GTK remains the fallback
# for Settings keys and general portals that Denial does not implement. The
# wlroots backend consumes zwlr-screencopy-v1 frames for capture requests.
[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=denial;gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
