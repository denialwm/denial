# packages.denialwm.org: Denial's package repositories, served from
# /srv/packages. Installed as /etc/nginx/conf.d/packages.denialwm.org.conf.
server {
    listen 80;
    listen [::]:80;
    server_name packages.denialwm.org;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name packages.denialwm.org;

    ssl_certificate /etc/letsencrypt/live/packages.denialwm.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/packages.denialwm.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/packages;
    autoindex on;

    # A package never changes under its name; the indexes change with every
    # release and are checked each time.
    location ~ \.(pkg\.tar\.zst|deb|rpm)(\.sig)?$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
    }
}
