name: denial_pets
description: Lets windows hold desktop pets on their edges and corners, with a contact shadow.
publish_to: none
version: 0.0.0
environment:
  sdk: ^3.13.0
  flutter: 3.47.5
dependencies:
  denial_sdk:
    path: ../../packages/denial_sdk
  denial_flutter_sdk:
    path: ../../packages/denial_flutter_sdk
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.26.3

denial_plugin:
  schema: 1
  name: Desktop Pets
  provides:
    - contract: package:denial_flutter_sdk/pets.dart#ShellPetHolds
    - contract: package:denial_flutter_sdk/pets.dart#ShellPetShadows
