publish_to: none
version: 0.0.0
environment:
  sdk: ^3.13.0
  flutter: 3.47.5
dependencies:
  archive: ^3.6.1
  collection: ^1.19.1
  crypto: ^3.0.5
  dbus: ^0.7.14
  denial_sdk:
    path: ../denial_sdk
  denial_wire_protocol:
    path: ../../protocol/generated/dart
  ffi: ^2.2.0
  flat_buffers: 25.9.23
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  meta: ^1.19.0
  motor: ^1.1.0
  path: ^1.9.1
  vector_graphics: ^1.2.2
dev_dependencies:
  test: ^1.26.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
