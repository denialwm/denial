<svg xmlns="http://www.w3.org/2000/svg" width="540" height="190" viewBox="0 0 540 190" role="img" aria-labelledby="title">
  <title>Denial：最后一笔，是你为它点睛</title>
  <g fill="#24292f" font-family="KaiTi, STKaiti, 'AR PL UKai CN', 'Noto Serif CJK SC', serif" font-size="18" text-anchor="middle">
    <text x="270" y="28">让窗轻滑，映着微光；</text>
    <text x="270" y="54">让每处细节，都如你所想。</text>
    <text x="270" y="80">不让配置文件，耗尽夜的漫长；</text>
    <text x="270" y="106">不为强大，舍去漂亮。</text>
    <text x="270" y="150">我们造窗，风景由你来定；</text>
    <text x="270" y="176">最后一笔，是你为它点睛。</text>
  </g>
</svg>
