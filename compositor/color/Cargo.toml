[package]
name = "denial-color"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Denial's output colour: colour spaces, HDR, lookup tables, gamma and plane colour"

[features]
flutter = []

[dependencies]
denial-core = { path = "../core" }
drm-ffi = "=0.9.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
tracing = { version = "0.1.37", features = ["max_level_trace", "release_max_level_info"] }
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "24647fc8d00131eb7f388efed26e35ea316b0018", default-features = false, features = ["backend_drm"] }
