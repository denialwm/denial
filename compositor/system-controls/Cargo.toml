[package]
name = "denial-system-controls"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Denial's audio, brightness, session power and idle policy"

[features]
flutter = ["denial-platform/flutter"]

[dependencies]
async-io = "=2.6.0"
denial-core = { path = "../core" }
denial-platform = { path = "../platform" }
futures-lite = "=2.6.1"
libloading = "0.9"
tracing = { version = "0.1.37", features = ["max_level_trace", "release_max_level_info"] }
zbus = "=5.18.0"
